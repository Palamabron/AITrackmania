# Hyperparameter search space for TMRL experiment tuning.
# Each parameter has: current baseline value, valid range, scale, and notes.
# Agents should reference this when proposing experiments.
#
# TARGET: finish track in <= 36 seconds (eval/finish_time_test_s)

# =============================================================================
# LEARNING RATES & OPTIMIZATION
# =============================================================================
optimization:
  algorithm.iqn_lr:
    baseline: 5.0e-5
    range: [1.0e-6, 5.0e-4]
    scale: log
    notes: >
      Main learning rate for IQN Q-network. Lower = more stable but slower.
      If loss is spiky, try 3e-5. If learning is too slow, try 1e-4.

  algorithm.weight_decay:
    baseline: 0.0
    range: [0.0, 1.0e-3]
    scale: log
    notes: AdamW weight decay. Small values (1e-5 to 1e-4) can help regularize.

  algorithm.adam_eps:
    baseline: 1.0e-8
    range: [1.0e-9, 1.0e-6]
    scale: log
    notes: Adam epsilon. Increase to 1e-7 if seeing NaN gradients.

  algorithm.iqn_grad_clip:
    baseline: 2.5
    range: [0.5, 20.0]
    scale: log
    notes: Gradient clipping norm. Lower = more stable, higher = faster learning.

  algorithm.iqn_soft_target_tau:
    baseline: 0.005
    range: [0.001, 0.05]
    scale: log
    notes: Polyak averaging for target network. Lower = more stable targets.

  training.batch_size:
    baseline: 512
    range: [128, 2048]
    scale: log
    notes: Larger batches reduce variance but need more memory. Must be > n_steps.

# =============================================================================
# RL ALGORITHM (IQN-specific)
# =============================================================================
rl_algorithm:
  algorithm.gamma:
    baseline: 0.99
    range: [0.95, 0.999]
    scale: linear
    notes: Discount factor. Higher = more far-sighted. 0.995 for long tracks.

  algorithm.n_steps:
    baseline: 3
    range: [1, 10]
    scale: linear
    notes: N-step returns. Higher = faster propagation of rewards but more variance.

  algorithm.iqn_dueling:
    baseline: true
    range: [true, false]
    scale: categorical
    notes: Dueling architecture separates value and advantage streams.

  algorithm.iqn_double_dqn:
    baseline: true
    range: [true, false]
    scale: categorical
    notes: Double DQN reduces overestimation bias.

  algorithm.iqn_huber_kappa:
    baseline: 0.7
    range: [0.1, 2.0]
    scale: linear
    notes: Huber loss threshold. Lower = more robust to outliers.

  algorithm.iqn_sort_quantiles:
    baseline: true
    range: [true, false]
    scale: categorical
    notes: Sort quantile predictions for monotonicity.

  algorithm.backup_clip_range:
    baseline: 25.0
    range: [5.0, 200.0]
    scale: log
    notes: Clips TD targets. Tighter = more stable but can limit learning.

  algorithm.reward_normalize_scale:
    baseline: 1.0
    range: [0.1, 10.0]
    scale: log
    notes: Scales all rewards. <1 compresses reward signal.

  algorithm.iqn_target_update_freq:
    baseline: 1000
    range: [100, 10000]
    scale: log
    notes: Hard target update frequency (if not using soft updates).

# =============================================================================
# EXPLORATION
# =============================================================================
exploration:
  algorithm.iqn_epsilon_start:
    baseline: 0.65
    range: [0.1, 1.0]
    scale: linear
    notes: Initial exploration rate. Higher = more random actions early on.

  algorithm.iqn_epsilon_end:
    baseline: 0.015
    range: [0.001, 0.1]
    scale: log
    notes: Final exploration rate. Lower = more exploitation.

  algorithm.iqn_epsilon_decay_steps:
    baseline: 400000
    range: [100000, 2000000]
    scale: log
    notes: Steps to decay from start to end epsilon. Longer = slower exploitation.

  algorithm.iqn_epsilon_schedule_mode:
    baseline: linear
    range: [linear, cosine]
    scale: categorical
    notes: Linear is simpler; cosine has warm restarts.

  algorithm.iqn_explore_repeat_steps:
    baseline: 1
    range: [1, 8]
    scale: linear
    notes: Repeat same action for N env steps. Higher = temporal abstraction.

# =============================================================================
# NOISY EXPLORATION (NoisyNet on DuelingHead)
# =============================================================================
noisy_exploration:
  algorithm.iqn_noisy_linear:
    baseline: false
    range: [true, false]
    scale: categorical
    notes: >
      NoisyNet on DuelingHead output layers. Complements epsilon-greedy
      with parameter-space exploration.

  algorithm.iqn_noisy_std_init:
    baseline: 0.5
    range: [0.01, 1.0]
    scale: log
    notes: Initial sigma for NoisyLinear factorized noise. Paper default 0.5.

  algorithm.iqn_noisy_scale_start:
    baseline: 1.0
    range: [0.5, 1.0]
    scale: linear
    notes: Initial noise scale multiplier on epsilon buffers.

  algorithm.iqn_noisy_scale_end:
    baseline: 0.05
    range: [0.001, 0.5]
    scale: log
    notes: Final noise scale after decay.

  algorithm.iqn_noisy_scale_decay_steps:
    baseline: 1000000
    range: [100000, 5000000]
    scale: log
    notes: Steps to linearly decay noise scale from start to end.

# =============================================================================
# MUNCHAUSEN RL (optional augmentation)
# =============================================================================
munchausen:
  algorithm.iqn_munchausen_enabled:
    baseline: false
    range: [true, false]
    scale: categorical
    notes: >
      Munchausen RL adds log-policy bonus to rewards. Can stabilize learning
      but adds complexity. Try with small alpha (0.02).

  algorithm.iqn_munchausen_alpha:
    baseline: 0.02
    range: [0.005, 0.1]
    scale: log
    notes: Scaling of the Munchausen bonus. Only active if enabled.

  algorithm.iqn_munchausen_tau:
    baseline: 0.2
    range: [0.05, 1.0]
    scale: log
    notes: Temperature for Munchausen log-policy.

# =============================================================================
# MODEL ARCHITECTURE
# =============================================================================
model_architecture:
  model.residual_mlp_hidden_dim:
    baseline: 192
    range: [64, 512]
    scale: log
    notes: Width of residual MLP blocks. Wider = more capacity, slower training.

  model.residual_mlp_num_blocks:
    baseline: 3
    range: [1, 8]
    scale: linear
    notes: Depth of Q-network trunk. More blocks = more capacity.

  model.gnn_hidden:
    baseline: 128
    range: [32, 256]
    scale: log
    notes: GTN track encoder hidden dimension.

  model.gnn_layers:
    baseline: 2
    range: [1, 4]
    scale: linear
    notes: Number of GTN transformer encoder layers.

  model.rnn_hidden_size:
    baseline: 192
    range: [64, 512]
    scale: log
    notes: GRU hidden size for temporal modeling.

  model.use_simbav2:
    baseline: true
    range: [true, false]
    scale: categorical
    notes: SimBa v2 residual backbone vs standard residual blocks.

  model.track_encoder:
    baseline: gtn
    range: [gtn, conv1d, spline_mlp]
    scale: categorical
    notes: How track geometry is encoded. GTN = transformer, conv1d = lightweight.

  model.api_layernorm:
    baseline: true
    range: [true, false]
    scale: categorical
    notes: LayerNorm on API (non-track) input features.

  model.binary_brake:
    baseline: true
    range: [true, false]
    scale: categorical
    notes: Binary brake output vs continuous. Binary is simpler.

# =============================================================================
# TRAINING LOOP
# =============================================================================
training_loop:
  training.training_steps_per_round:
    baseline: 300
    range: [100, 1000]
    scale: linear
    notes: Gradient steps per training round. More = more compute per round.

  training.rounds_per_epoch:
    baseline: 20
    range: [5, 100]
    scale: linear
    notes: Rounds per epoch. More = more training before eval.

  training.environment_steps_before_training:
    baseline: 20000
    range: [1000, 100000]
    scale: log
    notes: Warmup steps before training starts. More = better initial data.

  training.max_training_steps_per_environment_step:
    baseline: 15
    range: [1, 30]
    scale: linear
    notes: >
      UTD ratio cap. Higher = more gradient steps per env step.
      Too high causes trainer to outrun data freshness.

  training.update_model_interval:
    baseline: 250
    range: [50, 1000]
    scale: linear
    notes: Steps between pushing model to worker. Lower = fresher policy.

  training.update_buffer_interval:
    baseline: 1000
    range: [100, 5000]
    scale: linear
    notes: Steps between pulling new data from server.

  training.memory_size:
    baseline: 1000000
    range: [100000, 5000000]
    scale: log
    notes: Replay buffer capacity. Larger = more diverse data, more memory.

# =============================================================================
# REWARD SHAPING
# =============================================================================
reward_shaping:
  environment.end_of_track_reward:
    baseline: 10.0
    range: [0.0, 50.0]
    scale: linear
    notes: Bonus for completing the track. Higher incentivizes finishing.

  environment.reward.constant_penalty:
    baseline: 0.0015
    range: [0.0, 0.01]
    scale: linear
    notes: Per-step penalty encouraging faster completion. Higher = more urgency.

  environment.reward.speed_reward_weight:
    baseline: 1.5
    range: [0.0, 5.0]
    scale: linear
    notes: Weight on speed-aligned-with-track reward component.

  environment.reward.speed_reward_exponent:
    baseline: 1.4
    range: [1.0, 3.0]
    scale: linear
    notes: Exponent on speed reward. Higher = more reward for high speed.

  environment.reward.crash_penalty:
    baseline: 0.5
    range: [0.0, 5.0]
    scale: linear
    notes: Penalty per crash event.

  environment.reward.drift_reward_weight:
    baseline: 0.1
    range: [0.0, 1.0]
    scale: linear
    notes: Reward for controlled drifting on curves.

  environment.reward.max_track_width:
    baseline: 24.0
    range: [10.0, 50.0]
    scale: linear
    notes: Max distance from centerline before off-track termination.

  environment.reward.min_seconds_before_failure:
    baseline: 15.0
    range: [5.0, 30.0]
    scale: linear
    notes: Grace period before no-progress termination. Higher = more patient.

  environment.reward.reward_clip_floor:
    baseline: 5.0
    range: [0.0, 20.0]
    scale: linear
    notes: Floor clipping for negative rewards.

  environment.reward.cornering_speed_bonus:
    baseline: 0.0
    range: [0.0, 2.0]
    scale: linear
    notes: >
      Bonus for high speed through curves. Combines curvature, speed fraction,
      and alignment. Set > 0 to activate.

  environment.reward.progress_acceleration_bonus:
    baseline: 0.0
    range: [0.0, 1.0]
    scale: linear
    notes: >
      Bonus when current progress rate exceeds recent EMA average.
      Encourages acceleration rather than steady-state driving.

# =============================================================================
# DEMO / PLAYER RUNS
# =============================================================================
demos:
  player_runs.demo_max_batch_fraction:
    baseline: 0.25
    range: [0.0, 0.5]
    scale: linear
    notes: Max fraction of batch from demos. Higher = more imitation.

  player_runs.demo_min_batch_fraction:
    baseline: 0.10
    range: [0.0, 0.25]
    scale: linear
    notes: Min fraction of batch from demos. Ensures some imitation.

# =============================================================================
# ENVIRONMENT / INTERFACE
# =============================================================================
environment:
  environment.seed:
    baseline: 1111
    range: [0, 99999]
    scale: linear
    notes: Random seed. Change to test robustness of a config.

  environment.init_gas_bias:
    baseline: 0.9
    range: [0.0, 1.0]
    scale: linear
    notes: Initial bias toward gas in action space. Higher = more aggressive start.
