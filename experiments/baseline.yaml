# Baseline experiment config -- snapshot of local.yaml as of 2026-05-13.
# All experiments branch from this; experiment configs store only the DIFF.
# Source: C:\Users\szulc\TmrlData\config\local.yaml

run:
  name: gtn-testv1.0
  reset_training: true
  buffers_maxlen: 1000000
  rw_max_samples_per_episode: 28000
  rw_test_episode_interval: 20

wandb:
  project: tmrl
  entity: dsc-pjatk-warsaw
  log_gradients: false
  debug_reward: true
  log_from_worker: true

distributed:
  public_ip_server: "127.0.0.1"

training:
  rounds_per_epoch: 20
  training_steps_per_round: 300
  environment_steps_before_training: 20000
  max_training_steps_per_environment_step: 15
  update_model_interval: 250
  update_buffer_interval: 1000
  batch_size: 256

model:
  residual_mlp_hidden_dim: 192
  residual_mlp_num_blocks: 4
  residual_mlp_num_blocks_actor: 2
  residual_mlp_num_blocks_critic: 4
  split_track_observation: true
  use_simbav2: true
  track_encoder: gtn
  gnn_layers: 2
  gnn_hidden: 128
  binary_brake: true

algorithm:
  name: IQN
  _target_: tmrl.custom.custom_algorithms.iqn.IQNAgent
  iqn_lr: 3.5e-5
  gamma: 0.995
  iqn_huber_kappa: 1.0
  iqn_sort_quantiles: true
  iqn_monotonicity_regularization: false
  iqn_monotonicity_lambda: 0.01
  iqn_munchausen_enabled: false
  iqn_munchausen_alpha: 0.02
  iqn_munchausen_tau: 0.2
  iqn_munchausen_clip_min: -0.3
  iqn_munchausen_clip_max: 0.0
  iqn_epsilon_schedule_mode: linear
  iqn_epsilon_start: 0.5
  iqn_epsilon_end: 0.015
  iqn_epsilon_decay_steps: 2000000
  iqn_epsilon_cosine_t0: 50000
  iqn_epsilon_cosine_tmult: 1.5
  iqn_epsilon_cosine_decay: 0.8
  iqn_epsilon_cosine_floor_fraction: 0.5
  iqn_explore_repeat_steps: 1
  iqn_soft_target_tau: 0.005
  iqn_grad_clip: 15.0
  backup_clip_range: 150.0
  reward_normalize_scale: 1.0
  n_steps: 3
  iqn_dueling: true
  iqn_double_dqn: true

player_runs:
  online_injection: true
  max_files_per_update: 6
  demo_sampling_weight: 1.2
  demo_weight_decay_samples: 1500000
  demo_weight_decay_slowdown: 1.5
  demo_max_batch_fraction: 0.25
  demo_min_batch_fraction: 0.10

environment:
  seed: 1111
  init_gas_bias: 0.1
  map_name: test-3
  end_of_track_reward: 8.0
  window_width: 1920
  window_height: 1080
  use_images: false
  track_coords_divisor: 50.0
  reward:
    min_seconds_before_failure: 10.0
    debug_reward_components: true
    constant_penalty: 0.0015
    speed_reward_weight: 1.0
    speed_reward_exponent: 1.2
    speed_reward_alignment_floor: 0.1
    max_speed_kmh: 300.0
    max_track_width: 24.0
    reward_clip_floor: 5.0
    track_look_ahead_pct: 5.0
    track_point_spacing_m: 2.5
    track_local_frame: true
    track_curvature_obs: true
    drift_reward_weight: 0.1
    drift_reward_weight_start: 0.15
    drift_anneal_steps: 250000
    drift_optimal_angle_deg: 12.5
    crash_penalty: 1.0
