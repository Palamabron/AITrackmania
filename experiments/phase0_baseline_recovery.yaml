# Phase 0 - Baseline recovery (IQN regression recovery plan), SOTA-aligned edition.
#
# Goal: stable Conv1D lidar baseline with a corrected training pipeline AND reward
# philosophy aligned with SimbaV2_SDSAC_SOTA_v2.0 (tmrl/tmrl, 85% finishes,
# min 36.3s lap, return ~300) — without reverting to the deprecated TQC interface.
#
# Tuning deltas vs v9 (v9 diagnosis: margin loss works [demo_argmax_match 0.84],
# but slow_progress killed 99% of episodes at 3 m/s; agent learned slow driving
# for 20-115s without ever finishing; returns flat ~1 vs SOTA ~330):
#   - REMOVE min_progress_rate / slow_progress (user + SOTA: no rate-based cutoff).
#   - Rewards like SOTA: min_seconds_before_failure 0, no constant/terminal/crash
#     penalties, time_bonus_scale 0.0008 on finish (spread via apply_speed_bonus).
#   - projected_velocity_scale 0.1 -> 0.15 (denser lap-time signal).
#   - Training throughput like SOTA: warmup 20k, 15 updates/env-step, gamma 0.99,
#     iqn_lr 1e-4, soft_target_tau 0.005.
#   - Epsilon slower to greedy: start 0.3, decay 2M (v9 hit floor at ~75k steps).
#   - bc_lambda_end 0.2 -> 0.4, bc_anneal 1M -> 1.5M (keep margin loss + demos).
#   - ep_max_length 15000 (SOTA; was 5000 default).
#
# WandB checks after ~2-3h (compare to SOTA at similar train/step):
#   - run/term_reason: should NOT show slow_progress; expect end_of_track growth.
#   - run/reward: trending positive (SOTA ~300); alarm if median still negative.
#   - run/steps: hundreds per episode (SOTA ~845); alarm if still ~100.
#   - debug/demo_argmax_match: >0.7; metrics/return_train: >50 after several hours.
#
# NoisyNets and the Graph Transformer stay OFF (see PHASE 1 / PHASE 2 below).
# Deploy: copy this file over ~/TmrlData/config/local.yaml (BOTH the WSL copy and
# C:\Users\<you>\TmrlData\config\local.yaml), and start from a FRESH checkpoint so
# the replay buffer does not carry v9's slow_progress-truncated samples.

run:
  name: phase0_pipelinefix_v10
  reset_training: true
  buffers_maxlen: 1000000
  rw_max_samples_per_episode: 28000
  rw_test_episode_interval: 20

wandb:
  project: tmrlv2
  entity: dsc-pjatk-warsaw
  log_gradients: false
  debug_reward: true
  log_from_worker: true

distributed:
  public_ip_server: "127.0.0.1"

training:
  rounds_per_epoch: 20
  training_steps_per_round: 300
  # Real env samples only (demos are tracked separately since the accounting fix).
  environment_steps_before_training: 20000
  max_training_steps_per_environment_step: 15
  update_model_interval: 250
  update_buffer_interval: 1000
  batch_size: 512

# Note: binary_brake removed (no-op for IQN — the discrete action table already
# has binary gas/brake plus a tap mode; the flag only affects continuous actors).
model:
  residual_mlp_hidden_dim: 192
  residual_mlp_num_blocks: 4
  residual_mlp_num_blocks_actor: 2
  residual_mlp_num_blocks_critic: 4
  split_track_observation: true
  use_simbav2: true
  track_encoder: conv1d
  gnn_layers: 2
  gnn_hidden: 128

algorithm:
  name: IQN
  _target_: tmrl.custom.custom_algorithms.iqn.IQNAgent
  iqn_lr: 1.0e-4
  gamma: 0.99
  iqn_huber_kappa: 0.7
  iqn_sort_quantiles: true
  iqn_monotonicity_regularization: false
  iqn_monotonicity_lambda: 0.01

  iqn_munchausen_enabled: false
  iqn_munchausen_alpha: 0.02
  iqn_munchausen_tau: 0.2
  iqn_munchausen_clip_min: -0.3
  iqn_munchausen_clip_max: 0.0

  # DEMO + margin loss: 20-35% demo floor + DQfD margin on demo samples.
  # Epsilon stays high longer than v9 (SOTA still had eps~0.64 at 370k steps).
  # explore_repeat_steps=4 -> step-level random fraction 4*eps/(4*eps+1).
  iqn_epsilon_schedule_mode: linear
  iqn_epsilon_start: 0.3
  iqn_epsilon_end: 0.015
  iqn_epsilon_decay_steps: 2000000
  iqn_epsilon_cosine_t0: 100000
  iqn_epsilon_cosine_tmult: 1.5
  iqn_epsilon_cosine_decay: 0.8
  iqn_epsilon_cosine_floor_fraction: 0.5

  iqn_explore_repeat_steps: 4
  iqn_soft_target_tau: 0.005

  # DQfD large-margin demo loss (Dueling-invariant margin in advantage space).
  bc_lambda: 1.0
  bc_lambda_start: 1.0
  bc_lambda_end: 0.4
  bc_anneal_steps_start: 0
  bc_anneal_steps_end: 1500000
  bc_margin: 0.5

  iqn_grad_clip: 10.0
  iqn_grad_stabilizer_enabled: false

  backup_clip_range: 0.0
  reward_normalize_scale: 0.1

  n_steps: 3
  iqn_dueling: true
  iqn_double_dqn: true
  per_td_enabled: false
  per_td_alpha: 0.2

  iqn_noisy_linear: false
  iqn_noisy_std_init: 0.05
  iqn_noisy_eval_std: 0.01

player_runs:
  online_injection: true
  consume_on_read: false
  max_files_per_update: 6
  demo_max_batch_fraction: 0.35
  demo_min_batch_fraction: 0.20

environment:
  seed: 1111
  map_name: test-3
  end_of_track_reward: 10.0
  window_width: 1920
  window_height: 1080
  use_images: false
  track_coords_divisor: 50.0
  rtgym:
    ep_max_length: 15000
  reward:
    # SOTA: no stagnant-progress timeout — agent drives until finish or natural stall.
    min_seconds_before_failure: 0.0
    debug_reward_components: true

    progress_reward_full_lap: 200.0
    constant_penalty: 0.0
    terminal_failure_penalty: 0.0
    # SOTA SPEED_BONUS 0.0008 — spread over episode rewards on finish (worker).
    time_bonus_scale: 0.0008
    # Dense speed-along-track (gated on progress); raised for lap-time pressure.
    projected_velocity_scale: 0.15
    speed_reward_weight: 1.0
    speed_reward_exponent: 1.2
    speed_reward_alignment_floor: 0.1
    max_speed_kmh: 300.0

    max_track_width: 24.0
    reward_clip_floor: 5.0
    track_look_ahead_pct: 10.0
    track_point_spacing_m: 2.5
    track_local_frame: true

    drift_reward_weight: 0.03
    drift_reward_weight_start: 0.08
    drift_anneal_steps: 250000
    drift_optimal_angle_deg: 12.5

    crash_penalty: 0.0

    boundary_crash_penalty: 0.0
    boundary_penalty_weight: 0.3
    boundary_penalty_start: 0.85
    wall_hug_penalty_factor: 0.05
    wall_hug_lateral_threshold: 0.85
    wall_hug_speed_threshold: 10.0

# ---------------------------------------------------------------------------
# PHASE 1 - re-enable NoisyNets (only after Phase 0 converges to a stable lap).
# Flip the algorithm keys to:
#   iqn_noisy_linear: true
#   iqn_noisy_std_init: 0.05
#   iqn_noisy_eval_std: 0.01
#   iqn_epsilon_start: 0.0
#   iqn_epsilon_end: 0.0
#
# PHASE 2 - switch to the Graph Transformer (only after Phase 1 is stable).
#   model.track_encoder: gtn
#   algorithm.iqn_lr_warmup_steps: 120000
#   algorithm.iqn_lr_cosine_decay: true
#   algorithm.iqn_lr_min: 1.0e-6
#
# LAP-TIME PHASE (after the agent finishes reliably): raise projected_velocity_scale
# 0.15 -> 0.2 and consider boundary_crash_penalty > 0 once cornering is stable.
# ---------------------------------------------------------------------------
