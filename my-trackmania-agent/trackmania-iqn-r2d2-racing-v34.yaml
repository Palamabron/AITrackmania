api_version: "1.2"
run_id: trackmania-iqn-r2d2-racing-v34a
seed: 0
artifacts_dir: artifacts
distributed:
  port: 8787
  rollout_chunk_transitions: 128
  rollout_flush_s: 2.0
  policy_refresh_s: 5.0
  heartbeat_s: 5.0
  actor_timeout_s: 30.0
  max_inflight_chunks: 1
  spool_max_bytes: 2147483648
  soft_policy_lag_updates: 1000
  hard_policy_lag_updates: 5000
  max_update_credit: 512
  epsilon_profiles:
    - 1.0
  epsilon_start: 0.0125
  epsilon_final: 0.005
  epsilon_decay_transitions: 150000
components:
  learner:
    class_path: tmrl.algorithms.implicit_quantile_q_learning:ImplicitQuantileQLearning
    kwargs:
      learning_rate: 1.0e-4
      train_quantile_count: 64
      target_quantile_count: 64
      evaluation_quantile_count: 32
      gradient_clip_norm: 10.0
      target_tau: 0.005
      exploration_epsilon: 0.0125
      exploration_epsilon_final: 0.005
      exploration_epsilon_decay_updates: 150000
      value_rescaling: false
      demonstration_margin: 0.8
      demonstration_margin_weight: 1.0
      execution:
        device: cuda
        precision: bfloat16
        compile: false
        compile_mode: default
  environment:
    class_path: tmrl.trackmania.environment:OpenPlanetEnvironmentFactory
    kwargs:
      config:
        geometry_path: assets/test-3.geometry.npz
        use_racing_line: true
        expected_map_uid: oqIJ5rQDRrNwLPTh9H2p_W4tLof
        action_repeat_frames: 2
        nearest_forward_points: 100
        nearest_backward_points: 10
        slow_progress_window_steps: 180
        no_progress_steps: 120
        minimum_progress_per_window_m: 5.0
        terminal_failure_penalty: 5.0
        collision_penalty: 1.5
        collision_cooldown_s: 2.0
        time_penalty_per_second: 0.5
        max_time_delta_s: 1.0
        progress_reward_full_lap: 75.0
        finish_reward: 25.0
        potential_progress_weight: 0.0
        max_projected_speed_mps: 80.0
        velocity_to_mps_scale: 1.0
        projected_velocity_scale: 0.008
        projected_speed_bonus_scale: 0.2
        steering_delta_penalty: 0.02
        reward_gamma: 0.997
  model_factory:
    class_path: tmrl.trackmania.iqn:LidarIqnModelFactory
    kwargs:
      telemetry_dim: 26
      history_length: 16
      burn_in: 4
      spatial_bins: 12
  replay_store:
    class_path: tmrl.core.replay:InMemoryReplayStore
    kwargs:
      capacity: 400000
  sampler:
    class_path: tmrl.core.replay:PrioritizedSampler
    kwargs:
      alpha: 0.4
      elite_time_s: 46.0
      elite_priority_boost: 5.0
      uniform_mix: 0.2
  feature_pipeline:
    class_path: tmrl.trackmania.features:LidarFeaturePipeline
    kwargs:
      geometry_path: assets/test-3.geometry.npz
      expected_map_uid: oqIJ5rQDRrNwLPTh9H2p_W4tLof
      samples_per_side: 90
      max_distance_m: 180.0
      history_length: 1
      include_track_relative: true
      use_racing_line: true
      max_speed_mps: 80.0
      velocity_to_mps_scale: 1.0
      nearest_forward_points: 100
      nearest_backward_points: 10
  evaluator:
    class_path: tmrl.trackmania.evaluation:TrackmaniaEvaluator
  additional_loggers:
    - class_path: tmrl.observability.trackers:WandbTracker
      kwargs:
        project: my-trackmania-agent
evaluation:
  name: test-3-r2d2-racing
  version: "13"
  maps:
    - id: test-3
      map_path: maps/test-3.Map.Gbx
      geometry_path: assets/test-3.geometry.npz
      expected_map_uid: oqIJ5rQDRrNwLPTh9H2p_W4tLof
  trials_per_map: 10
  target_median_s: 37.0
  min_finish_rate: 0.9
  time_buckets_s: [40.0, 38.0, 36.0]
training:
  total_transitions: 1500000
  max_episode_steps: 5000
  batch_size: 256
  sequence_length: 16
  n_step: 5
  gamma: 0.997
  beta: 0.4
  per_beta_final: 1.0
  per_beta_anneal_transitions: 1200000
  warmup_transitions: 50000
  updates_per_transition: 0.02
  checkpoint_interval_updates: 5000
  metrics_interval_updates: 50
  evaluate_every_episodes: 50
