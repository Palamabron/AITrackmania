[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "my-trackmania-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["trackmaniarl[trackmania,algorithms,wandb,distributed]", "torch>=2.4"]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["mypy>=1.8", "poethepoet>=0.36", "pytest>=7.0", "ruff>=0.4"]

[tool.uv.sources]
trackmaniarl = { path = "..", editable = true }
torch = [
  { index = "pytorch-cuda", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.poe.tasks]
fmt = [{ cmd = "ruff format ." }, { cmd = "ruff check --fix ." }]
types = "mypy --strict src tests"
test = "pytest"
record-left = "trackmaniarl track record-boundary left assets/trackmaniarl-test-left.npy"
record-right = "trackmaniarl track record-boundary right assets/trackmaniarl-test-right.npy"
build-geometry = "trackmaniarl track build-geometry assets/trackmaniarl-test.geometry.npz --left assets/trackmaniarl-test-left.npy --right assets/trackmaniarl-test-right.npy --map-uid oqIJ5rQDRrNwLPTh9H2p_W4tLof --map-path maps/trackmaniarl-test.Map.Gbx"
