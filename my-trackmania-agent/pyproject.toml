[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "my-trackmania-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["tmrl[trackmania,algorithms,wandb,distributed]", "torch>=2.4"]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["mypy>=1.8", "poethepoet>=0.36", "pytest>=7.0", "ruff>=0.4"]

[tool.uv.sources]
tmrl = { path = "..", editable = true }
torch = [
  { index = "pytorch-cuda", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.poe.tasks]
fmt = [{ cmd = "ruff format ." }, { cmd = "ruff check --fix ." }]
types = "mypy --strict src tests"
test = "pytest"
record-left = "tmrl track record-boundary left assets/tmrl-test-left.npy"
record-right = "tmrl track record-boundary right assets/tmrl-test-right.npy"
build-geometry = "tmrl track build-geometry assets/tmrl-test.geometry.npz --left assets/tmrl-test-left.npy --right assets/tmrl-test-right.npy --map-uid oqIJ5rQDRrNwLPTh9H2p_W4tLof --map-path maps/tmrl-test.Map.Gbx"
