api_version: "1.2"
run_id: trackmania-iqn-lidar-v23-finetune
seed: 0
artifacts_dir: artifacts
distributed:
  port: 8787
  rollout_chunk_transitions: 128
  rollout_flush_s: 2.0
  policy_refresh_s: 5.0
  heartbeat_s: 5.0
  actor_timeout_s: 30.0
  max_inflight_chunks: 4
  spool_max_bytes: 2147483648
  soft_policy_lag_updates: 1000
  hard_policy_lag_updates: 5000
  epsilon_profiles:
    - 1.0
  epsilon_start: 0.0125
  epsilon_final: 0.001
  epsilon_decay_transitions: 150000
components:
  learner:
    class_path: trackmaniarl.algorithms.implicit_quantile_q_learning:ImplicitQuantileQLearning
    kwargs:
      learning_rate: 1.0e-4
      gradient_clip_norm: 10.0
      target_tau: 0.005
      exploration_epsilon: 0.0125
      exploration_epsilon_final: 0.001
      exploration_epsilon_decay_updates: 150000
      execution:
        device: auto
        precision: auto
        compile: false
        compile_mode: default
  environment:
    class_path: trackmaniarl.trackmania.environment:OpenPlanetEnvironmentFactory
    kwargs:
      config:
        trajectory_path: assets/trajectory.csv
        geometry_path: assets/trackmaniarl-test.geometry.npz
        expected_map_uid: oqIJ5rQDRrNwLPTh9H2p_W4tLof
        action_repeat_frames: 4
        slow_progress_window_steps: 180
        no_progress_steps: 120
        minimum_progress_per_window_m: 5.0
        terminal_failure_penalty: 0.5
        collision_penalty: 0.75
        collision_cooldown_s: 2.0
        time_penalty_per_second: 0.0
        max_time_delta_s: 1.0
        progress_reward_full_lap: 100.0
        finish_reward: 5.0
        potential_progress_weight: 0.0
        max_projected_speed_mps: 80.0
        velocity_to_mps_scale: 1.0
        projected_velocity_scale: 0.1
        projected_speed_bonus_scale: 0.0
        steering_delta_penalty: 0.02
        reward_gamma: 0.99
  model_factory:
    class_path: trackmaniarl.trackmania.iqn:LidarIqnModelFactory
  replay_store:
    class_path: trackmaniarl.core.replay:InMemoryReplayStore
    kwargs:
      capacity: 250000
  sampler:
    class_path: trackmaniarl.core.replay:PrioritizedSampler
    kwargs:
      alpha: 0.4
  feature_pipeline:
    class_path: trackmaniarl.trackmania.features:LidarFeaturePipeline
    kwargs:
      geometry_path: assets/trackmaniarl-test.geometry.npz
      expected_map_uid: oqIJ5rQDRrNwLPTh9H2p_W4tLof
      samples_per_side: 60
      max_distance_m: 150.0
  evaluator:
    class_path: trackmaniarl.trackmania.evaluation:TrackmaniaEvaluator
  additional_loggers:
    - class_path: trackmaniarl.observability.trackers:WandbTracker
      kwargs:
        project: my-trackmania-agent
evaluation:
  name: trackmaniarl-test-fast
  version: "3"
  maps:
    - id: trackmaniarl-test
      map_path: maps/trackmaniarl-test.Map.Gbx
      geometry_path: assets/trackmaniarl-test.geometry.npz
      expected_map_uid: oqIJ5rQDRrNwLPTh9H2p_W4tLof
  trials_per_map: 10
training:
  total_transitions: 750000
  max_episode_steps: 5000
  batch_size: 512
  n_step: 5
  gamma: 0.99
  beta: 0.4
  per_beta_final: 1.0
  per_beta_anneal_transitions: 2000000
  warmup_transitions: 2000
  updates_per_transition: 0.35
  checkpoint_interval_updates: 10000
  metrics_interval_updates: 50
  evaluate_every_episodes: 50
