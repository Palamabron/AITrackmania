api_version: "1.2"
run_id: trackmania-iqn-lidar-v10-correct-iqn
seed: 0
artifacts_dir: artifacts
distributed:
  port: 8787
  rollout_chunk_transitions: 128
  rollout_flush_s: 2.0
  policy_refresh_s: 5.0
  heartbeat_s: 5.0
  actor_timeout_s: 20.0
  max_inflight_chunks: 4
  spool_max_bytes: 2147483648
  soft_policy_lag_updates: 1000
  hard_policy_lag_updates: 5000
  epsilon_profiles:
    - 1.0
  epsilon_start: 0.5
  epsilon_final: 0.05
  epsilon_decay_transitions: 1500000
components:
  learner:
    class_path: tmrl.algorithms.implicit_quantile_q_learning:ImplicitQuantileQLearning
    kwargs:
      learning_rate: 3.0e-5
      gradient_clip_norm: 1.0
      target_tau: 0.005
      exploration_epsilon: 0.5
      exploration_epsilon_final: 0.015
      exploration_epsilon_decay_updates: 2000000
      execution:
        device: auto
        precision: auto
        compile: false
        compile_mode: default
  environment:
    class_path: tmrl.trackmania.environment:OpenPlanetEnvironmentFactory
    kwargs:
      config:
        trajectory_path: assets/trajectory.csv
        geometry_path: assets/test-3.geometry.npz
        expected_map_uid: oqIJ5rQDRrNwLPTh9H2p_W4tLof
        action_repeat_frames: 4
        slow_progress_window_steps: 504
        no_progress_steps: 336
        minimum_progress_per_window_m: 0.5
  model_factory:
    class_path: tmrl.trackmania.iqn:LidarIqnModelFactory
  replay_store:
    class_path: tmrl.core.replay:InMemoryReplayStore
    kwargs:
      capacity: 2000000
  sampler:
    class_path: tmrl.core.replay:PrioritizedSampler
  feature_pipeline:
    class_path: tmrl.trackmania.features:LidarFeaturePipeline
    kwargs:
      geometry_path: assets/test-3.geometry.npz
      expected_map_uid: oqIJ5rQDRrNwLPTh9H2p_W4tLof
  evaluator:
    class_path: tmrl.trackmania.evaluation:TrackmaniaEvaluator
  additional_loggers:
    - class_path: tmrl.observability.trackers:WandbTracker
      kwargs:
        project: my-trackmania-agent
evaluation:
  name: test-3
  version: "1"
  maps:
    - id: test-3
      map_path: maps/test-3.Map.Gbx
      geometry_path: assets/test-3.geometry.npz
      expected_map_uid: oqIJ5rQDRrNwLPTh9H2p_W4tLof
  trials_per_map: 20
training:
  total_transitions: 2000000
  max_episode_steps: 5000
  batch_size: 512
  n_step: 3
  gamma: 0.995
  beta: 0.4
  per_beta_final: 1.0
  per_beta_anneal_transitions: 2000000
  warmup_transitions: 20000
  updates_per_transition: 0.25
  checkpoint_interval_updates: 5000
  metrics_interval_updates: 50
  evaluate_every_episodes: 25
