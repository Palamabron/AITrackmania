name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  TORCH_CPU_INDEX: https://download.pytorch.org/whl/cpu
  TORCH_CPU_VERSION: 2.11.0+cpu
  UV_VERSION: "0.12.5"

jobs:
  source-gate:
    name: Source gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VGAMEPAD_SKIP_VIGEMBUS_INSTALL: "true"
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true

      - name: Export locked development requirements without CUDA Torch
        run: uv export --quiet --locked --group dev --prune torch --no-header --no-annotate --no-emit-project --output-file .ci-dev-requirements.txt

      - name: Verify exact CPU Torch resolution
        run: uv run --isolated --no-project --no-config --index "${{ env.TORCH_CPU_INDEX }}" --index-strategy unsafe-best-match --with "torch==${{ env.TORCH_CPU_VERSION }}" --with-requirements .ci-dev-requirements.txt python -c "import os, torch; assert torch.__version__ == os.environ['TORCH_CPU_VERSION'], torch.__version__; assert torch.version.cuda is None, torch.version.cuda"

      - name: Verify lock file
        run: uv lock --check

      - name: Verify formatting
        run: uv run --isolated --no-project --no-config --index "${{ env.TORCH_CPU_INDEX }}" --index-strategy unsafe-best-match --with "torch==${{ env.TORCH_CPU_VERSION }}" --with-requirements .ci-dev-requirements.txt ruff format --check .

      - name: Run Ruff
        run: uv run --isolated --no-project --no-config --index "${{ env.TORCH_CPU_INDEX }}" --index-strategy unsafe-best-match --with "torch==${{ env.TORCH_CPU_VERSION }}" --with-requirements .ci-dev-requirements.txt ruff check .

      - name: Run strict mypy with CPU Torch
        run: uv run --isolated --no-project --no-config --index "${{ env.TORCH_CPU_INDEX }}" --index-strategy unsafe-best-match --with "torch==${{ env.TORCH_CPU_VERSION }}" --with-requirements .ci-dev-requirements.txt mypy --strict trackmaniarl

      - name: Run full test suite with CPU Torch
        run: uv run --isolated --no-project --no-config --index "${{ env.TORCH_CPU_INDEX }}" --index-strategy unsafe-best-match --with "torch==${{ env.TORCH_CPU_VERSION }}" --with-requirements .ci-dev-requirements.txt pytest

  build:
    name: Build release bytes
    needs: source-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true

      - name: Build distributables once
        run: uv build

      - name: Stage wheel and dependency metadata for the SBOM
        shell: bash
        run: |
          uv run --isolated --no-project --index "$TORCH_CPU_INDEX" --with "torch==$TORCH_CPU_VERSION" --with ./dist/*.whl python - <<'PY'
          import shutil
          import zipfile
          from importlib.metadata import distributions
          from pathlib import Path, PurePosixPath

          target = Path("sbom-root")
          target.mkdir()
          metadata_paths = {
              Path(distribution.locate_file(part.parts[0])).resolve()
              for distribution in distributions()
              for part in distribution.files or ()
              if len(part.parts) == 2 and part.parts[0].endswith(".dist-info")
          }
          for metadata in sorted(metadata_paths):
              if not metadata.name.lower().startswith("trackmaniarl-"):
                  shutil.copytree(metadata, target / metadata.name, dirs_exist_ok=True)
          wheel = next(Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              for member in archive.namelist():
                  relative = PurePosixPath(member)
                  is_metadata = any(part.endswith(".dist-info") for part in relative.parts)
                  if (
                      member.endswith("/")
                      or not is_metadata
                      or relative.is_absolute()
                      or ".." in relative.parts
                  ):
                      continue
                  destination = target.joinpath(*relative.parts)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(archive.read(member))
          PY

      - name: Generate SPDX JSON SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: sbom-root
          format: spdx-json
          output-file: dist/trackmaniarl-release.spdx.json
          syft-version: v1.51.0
          upload-artifact: false
          upload-release-assets: false

      - name: Validate release and write checksums
        run: uv run --isolated --no-project python scripts/check_distribution.py --tag "${{ github.ref_name }}" --write-checksums

      - name: Upload the canonical release distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist
          path: dist/
          compression-level: 0
          retention-days: 30
          if-no-files-found: error

  verify-dist:
    name: Verify release bytes (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true

      - name: Download the canonical release distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist
          digest-mismatch: error

      - name: Verify distribution contents and checksums
        run: uv run --isolated --no-project python scripts/check_distribution.py --tag "${{ github.ref_name }}" --verify-checksums

      - name: Verify wheel CLI on Linux
        if: runner.os == 'Linux'
        shell: bash
        env:
          TORCH_CPU_INDEX: https://download.pytorch.org/whl/cpu
          TORCH_CPU_VERSION: 2.11.0+cpu
        run: |
          wheel="$(realpath "$GITHUB_WORKSPACE"/dist/*.whl)"
          cd "$(mktemp -d)"
          uv run --isolated --no-project --index "$TORCH_CPU_INDEX" --with "torch==$TORCH_CPU_VERSION" --with "$wheel" trackmaniarl --help

      - name: Verify wheel import on Linux
        if: runner.os == 'Linux'
        shell: bash
        env:
          TORCH_CPU_INDEX: https://download.pytorch.org/whl/cpu
          TORCH_CPU_VERSION: 2.11.0+cpu
        run: |
          wheel="$(realpath "$GITHUB_WORKSPACE"/dist/*.whl)"
          cd "$(mktemp -d)"
          uv run --isolated --no-project --index "$TORCH_CPU_INDEX" --with "torch==$TORCH_CPU_VERSION" --with "$wheel" python -c "import importlib.metadata as m, os, torch, trackmaniarl; expected = os.environ['GITHUB_REF_NAME'].removeprefix('v'); installed = m.version('TrackmaniaRL'); assert torch.version.cuda is None, torch.version.cuda; assert trackmaniarl.__version__ == installed == expected, (trackmaniarl.__version__, installed, expected)"

      - name: Verify generated project on Linux
        if: runner.os == 'Linux'
        shell: bash
        env:
          TORCH_CPU_INDEX: https://download.pytorch.org/whl/cpu
          TORCH_CPU_VERSION: 2.11.0+cpu
        run: |
          wheel="$(realpath "$GITHUB_WORKSPACE"/dist/*.whl)"
          test_dir="$(mktemp -d)"
          agent_dir="$test_dir/agent"
          cd "$test_dir"
          uv run --isolated --no-project --index "$TORCH_CPU_INDEX" --with "torch==$TORCH_CPU_VERSION" --with "$wheel" trackmaniarl init "$agent_dir"
          uv lock --directory "$agent_dir" --find-links "$GITHUB_WORKSPACE/dist"

      - name: Verify wheel CLI and generated project on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TORCH_CPU_INDEX: https://download.pytorch.org/whl/cpu
          TORCH_CPU_VERSION: 2.11.0+cpu
          UV_INDEX: pytorch-cuda=https://download.pytorch.org/whl/cpu
        run: |
          $wheel = (Get-ChildItem dist -Filter *.whl -File | Select-Object -First 1).FullName
          $testDir = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP "release-wheel-test")
          $agentDir = Join-Path $testDir.FullName "agent"
          Push-Location $testDir.FullName
          try {
            uv run --isolated --no-project --index "$env:TORCH_CPU_INDEX" --with "torch==$env:TORCH_CPU_VERSION" --with "$wheel" python -c "import importlib.metadata as m, os, torch, trackmaniarl; expected = os.environ['GITHUB_REF_NAME'].removeprefix('v'); installed = m.version('TrackmaniaRL'); assert torch.version.cuda is None, torch.version.cuda; assert trackmaniarl.__version__ == installed == expected, (trackmaniarl.__version__, installed, expected)"
            uv run --isolated --no-project --index "$env:TORCH_CPU_INDEX" --with "torch==$env:TORCH_CPU_VERSION" --with "$wheel" trackmaniarl --help
            uv run --isolated --no-project --index "$env:TORCH_CPU_INDEX" --with "torch==$env:TORCH_CPU_VERSION" --with "$wheel" trackmaniarl init "$agentDir"
          } finally {
            Pop-Location
          }
          uv lock --directory "$agentDir" --find-links (Resolve-Path dist)
          $lock = Get-Content (Join-Path $agentDir "uv.lock") -Raw
          if ($lock -match 'download(?:-r2)?\.pytorch\.org/whl/cu[0-9]+' -or $lock -match 'torch-[^"\s]*%2Bcu') {
            throw "generated Windows project resolved a CUDA Torch wheel"
          }
          if ($lock -notmatch 'download(?:-r2)?\.pytorch\.org/whl/cpu' -or $lock -notmatch 'version = "[^"]+\+cpu"') {
            throw "generated Windows project did not resolve CPU Torch"
          }

  attest-publish:
    name: Attest and publish canonical bytes
    needs: verify-dist
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: false

      - name: Download the verified release distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist
          digest-mismatch: error

      - name: Verify checksums before attestation
        shell: bash
        run: cd dist && sha256sum --check SHA256SUMS

      - name: Attest SLSA build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Attest SPDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
          sbom-path: dist/trackmaniarl-release.spdx.json

      - name: Verify GitHub provenance and SBOM attestations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          signer="$GITHUB_REPOSITORY/.github/workflows/release.yml"
          for artifact in dist/*.whl dist/*.tar.gz; do
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY" --signer-workflow "$signer" --source-digest "$GITHUB_SHA"
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY" --signer-workflow "$signer" --source-digest "$GITHUB_SHA" --predicate-type https://spdx.dev/Document/v2.3
          done

      - name: Create PEP 740 publish attestations
        uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027 # v0.0.6
        with:
          paths: |
            dist/*.whl
            dist/*.tar.gz

      - name: Verify PEP 740 publish attestations
        shell: bash
        run: |
          identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF"
          for artifact in dist/*.whl dist/*.tar.gz; do
            uvx --from pypi-attestations==0.0.30 pypi-attestations verify attestation --identity "$identity" "$artifact"
          done

      - name: Publish the attested release to PyPI
        run: uv publish dist/*.whl dist/*.tar.gz
