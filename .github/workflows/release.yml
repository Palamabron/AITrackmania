name: Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - name: Install development dependencies
        env:
          UV_INDEX_PYTORCH_CUDA: https://download.pytorch.org/whl/cpu
        run: uv sync --locked --group dev

      - name: Verify formatting
        run: uv run ruff format --check .

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run strict mypy
        run: uv run mypy --strict trackmaniarl

      - name: Run full test suite
        run: uv run pytest

  publish:
    needs: gate
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - name: Install build dependencies
        env:
          UV_INDEX_PYTORCH_CUDA: https://download.pytorch.org/whl/cpu
        run: uv sync --locked --group dev

      - name: Build distributables
        run: uv build

      - name: Verify distribution contents and release tag
        run: uv run python scripts/check_distribution.py --tag "$GITHUB_REF_NAME"

      - name: Verify wheel CLI
        run: uv run --isolated --no-project --with ./dist/*.whl trackmaniarl --help

      - name: Verify generated project resolves the released wheel
        run: |
          agent_dir="$(mktemp -d)/agent"
          uv run --isolated --no-project --with ./dist/*.whl trackmaniarl init "$agent_dir"
          uv lock --directory "$agent_dir" --find-links "$GITHUB_WORKSPACE/dist"

      - name: Publish to PyPI
        run: uv publish
