name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "refactor/**"
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        env:
          UV_INDEX_PYTORCH_CUDA: https://download.pytorch.org/whl/cpu
        run: uv sync --group dev --upgrade-package torch

      - name: Check formatting (ruff format)
        run: uv run ruff format --check .

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Type-check (mypy)
        run: uv run mypy tmrl/

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.12"

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        env:
          UV_INDEX_PYTORCH_CUDA: https://download.pytorch.org/whl/cpu
        run: uv sync --group dev --upgrade-package torch

      - name: Run tests
        env:
          TMRL_DISABLE_GAME: "1"
        run: uv run pytest tests/ -v --tb=short

  package:
    name: Build distributables
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - name: Install build dependencies
        env:
          UV_INDEX_PYTORCH_CUDA: https://download.pytorch.org/whl/cpu
        run: uv sync --group dev --upgrade-package torch

      - name: Build source distribution and wheel
        run: uv build

      - name: Verify license contents
        run: uv run python scripts/check_distribution.py
