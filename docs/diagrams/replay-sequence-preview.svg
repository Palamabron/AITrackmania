<text x="245.0" y="653.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" fill="#475569"><tspan x="245.0" dy="0">L unique history IDs +</tspan><tspan x="245.0" dy="22.5">complete n-step horizon</tspan></text>
<rect x="85" y="760" width="320" height="90" rx="12" fill="#ffedd5" stroke="#d97706" stroke-width="2.5" filter="url(#shadow)"/>
<text x="245.0" y="798.75" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" fill="#111827"><tspan x="245.0" dy="0">Sampled anchor weight</tspan></text>
<text x="245.0" y="826.75" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" fill="#475569"><tspan x="245.0" dy="0">normalized IS weight</tspan></text>
<rect x="510" y="190" width="440" height="105" rx="12" fill="#dcfce7" stroke="#2b8a3e" stroke-width="2.5" filter="url(#shadow)"/>
<text x="730.0" y="236.25" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" fill="#111827"><tspan x="730.0" dy="0">Sequence window</tspan></text>
<text x="730.0" y="264.25" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" fill="#475569"><tspan x="730.0" dy="0">t0 … tL−1; priority anchor = tL−1</tspan></text>
<rect x="510" y="385" width="205" height="120" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="2.5" filter="url(#shadow)"/>
<text x="612.5" y="427.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" fill="#111827"><tspan x="612.5" dy="0">Burn-in [0, B)</tspan></text>
<text x="612.5" y="455.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" fill="#475569"><tspan x="612.5" dy="0">state update only</tspan><tspan x="612.5" dy="22.5">detached gradient</tspan></text>
<rect x="745" y="385" width="205" height="120" rx="12" fill="#cffafe" stroke="#087f8c" stroke-width="2.5" filter="url(#shadow)"/>
<text x="847.5" y="415.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" fill="#111827"><tspan x="847.5" dy="0">Learning</tspan><tspan x="847.5" dy="25.0">positions</tspan></text>
<text x="847.5" y="468.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" fill="#475569"><tspan x="847.5" dy="0">B … L−n−1 plus</tspan><tspan x="847.5" dy="22.5">final anchor</tspan></text>
<rect x="510" y="610" width="205" height="105" rx="12" fill="#dbeafe" stroke="#1864ab" stroke-width="2.5" filter="url(#shadow)"/>
<text x="612.5" y="645.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" fill="#111827"><tspan x="612.5" dy="0">Validity mask</tspan></text>
<text x="612.5" y="673.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" fill="#475569"><tspan x="612.5" dy="0">valid loss</tspan><tspan x="612.5" dy="22.5">positions only</tspan></text>
<rect x="745" y="610" width="205" height="105" rx="12" fill="#ede9fe" stroke="#7048e8" stroke-width="2.5" filter="url(#shadow)"/>
<text x="847.5" y="645.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" fill="#111827"><tspan x="847.5" dy="0">Target history</tspan></text>
<text x="847.5" y="673.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" fill="#475569"><tspan x="847.5" dy="0">next window keeps</tspan><tspan x="847.5" dy="22.5">context</tspan></text>
<rect x="625" y="765" width="215" height="90" rx="12" fill="#dcfce7" stroke="#2b8a3e" stroke-width="2.5" filter="url(#shadow)"/>
<text x="732.5" y="792.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" fill="#111827"><tspan x="732.5" dy="0">Per-position loss</tspan></text>
<text x="732.5" y="820.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" fill="#475569"><tspan x="732.5" dy="0">value regression</tspan><tspan x="732.5" dy="22.5">per valid position</tspan></text>
<rect x="1045" y="210" width="240" height="115" rx="12" fill="#cffafe" stroke="#087f8c" stroke-width="2.5" filter="url(#shadow)"/>
<text x="1165.0" y="250.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" fill="#111827"><tspan x="1165.0" dy="0">Double-Q bootstrap</tspan></text>
<text x="1165.0" y="278.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" fill="#475569"><tspan x="1165.0" dy="0">online selects</tspan><tspan x="1165.0" dy="22.5">target evaluates</tspan></text>
<rect x="1045" y="425" width="240" height="145" rx="12" fill="#ede9fe" stroke="#7048e8" stroke-width="2.5" filter="url(#shadow)"/>
<text x="1165.0" y="480.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" fill="#111827"><tspan x="1165.0" dy="0">n-step target</tspan></text>
<text x="1165.0" y="508.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" fill="#475569"><tspan x="1165.0" dy="0">Gₜ = Σ γⁱ rₜ₊ᵢ + γᵏ</tspan><tspan x="1165.0" dy="22.5">Qtarget(sₜ₊ₖ)</tspan></text>
<rect x="1045" y="690" width="240" height="115" rx="12" fill="#fee2e2" stroke="#c92a2a" stroke-width="2.5" filter="url(#shadow)"/>
<text x="1165.0" y="730.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" fill="#111827"><tspan x="1165.0" dy="0">Bootstrap contract</tspan></text>
<text x="1165.0" y="758.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" fill="#475569"><tspan x="1165.0" dy="0">terminated: zero</tspan><tspan x="1165.0" dy="22.5">truncated: bootstrap</tspan></text>
<rect x="1375" y="205" width="245" height="110" rx="12" fill="#fee2e2" stroke="#c92a2a" stroke-width="2.5" filter="url(#shadow)"/>
<text x="1497.5" y="242.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" fill="#111827"><tspan x="1497.5" dy="0">Absolute value error</tspan></text>
<text x="1497.5" y="270.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" fill="#475569"><tspan x="1497.5" dy="0">one |TD| per trained</tspan><tspan x="1497.5" dy="22.5">position</tspan></text>
<rect x="1375" y="405" width="245" height="135" rx="12" fill="#ffedd5" stroke="#d97706" stroke-width="2.5" filter="url(#shadow)"/>
<text x="1497.5" y="455.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" fill="#111827"><tspan x="1497.5" dy="0">Sequence priority</tspan></text>
<text x="1497.5" y="483.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" fill="#475569"><tspan x="1497.5" dy="0">p = 0.9 · max(|TD|) +</tspan><tspan x="1497.5" dy="22.5">0.1 · mean(|TD|)</tspan></text>
<rect x="1375" y="630" width="245" height="120" rx="12" fill="#dcfce7" stroke="#2b8a3e" stroke-width="2.5" filter="url(#shadow)"/>
<text x="1497.5" y="672.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" fill="#111827"><tspan x="1497.5" dy="0">Sampling probability</tspan></text>
<text x="1497.5" y="700.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" fill="#475569"><tspan x="1497.5" dy="0">p^alpha + optional</tspan><tspan x="1497.5" dy="22.5">uniform/elite mix</tspan></text>
<rect x="1375" y="760" width="245" height="110" rx="12" fill="#dbeafe" stroke="#1864ab" stroke-width="2.5" filter="url(#shadow)"/>
<text x="1497.5" y="787" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" fill="#111827"><tspan x="1497.5" dy="0">Importance</tspan><tspan x="1497.5" dy="25.0">correction</tspan></text>
<text x="1497.5" y="840" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" fill="#475569"><tspan x="1497.5" dy="0">w = (N · P)^−beta</tspan><tspan x="1497.5" dy="22.5">normalized by max</tspan></text>
<rect x="85" y="990" width="1530" height="62" rx="10" fill="#fee2e2" stroke="#c92a2a" stroke-width="1.5"/>
<text x="99" y="1021" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="18" fill="#1f2937"><tspan x="99" dy="0">Validated before training: n_step &lt; sequence_length, burn_in &lt; sequence_length, and sequence replay cannot be combined with a feature pipeline that</tspan><tspan x="99" dy="22.5">already stacks history.</tspan></text>
<rect x="85" y="1065" width="1530" height="70" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
<text x="99" y="1096" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="18" fill="#1f2937"><tspan x="99" dy="0">Scope: R2D2-style recurrent replay. The package reconstructs episode-local histories and burn-in, but does not claim the complete distributed R2D2</tspan><tspan x="99" dy="22.5">system.</tspan></text>
