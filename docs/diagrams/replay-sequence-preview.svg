<text x="55" y="61" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="32" fill="#111827"><tspan x="55" dy="0">Recurrent replay sequence, n-step target and PER feedback</tspan></text>
<text x="55" y="99" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="18" fill="#64748b"><tspan x="55" dy="0">A sampled anchor is eligible only when its full episode-local history and n-step horizon are available; burn-in is context, not a loss region.</tspan></text>
