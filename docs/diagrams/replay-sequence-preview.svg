<rect x="85" y="190" width="320" height="105" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="2.5" filter="url(#shadow)"/>
<text x="245.0" y="236.25" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" fill="#111827"><tspan x="245.0" dy="0">Replay transitions</tspan></text>
<text x="245.0" y="264.25" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" fill="#475569"><tspan x="245.0" dy="0">interleaved actor IDs</tspan></text>
<rect x="85" y="380" width="320" height="115" rx="12" fill="#fee2e2" stroke="#c92a2a" stroke-width="2.5" filter="url(#shadow)"/>
<text x="245.0" y="420.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" fill="#111827"><tspan x="245.0" dy="0">Episode-local chain</tspan></text>
<text x="245.0" y="448.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" fill="#475569"><tspan x="245.0" dy="0">same episode + step</tspan><tspan x="245.0" dy="22.5">no boundary crossing</tspan></text>
<rect x="85" y="585" width="320" height="115" rx="12" fill="#dbeafe" stroke="#1864ab" stroke-width="2.5" filter="url(#shadow)"/>
