<text x="94" y="906" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="18" fill="#1f2937"><tspan x="94" dy="0">Fail closed: reject a foreign journal or a checkpoint frontier older than the journal&#x27;s durable prune</tspan><tspan x="94" dy="22.5">floor.</tspan></text>
<rect x="80" y="955" width="1040" height="58" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
<text x="94" y="986" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="18" fill="#1f2937"><tspan x="94" dy="0">Warm-start copies reviewed model tensors only; it never restores replay, optimizer, RNG, counters or</tspan><tspan x="94" dy="22.5">WAL identity.</tspan></text>
