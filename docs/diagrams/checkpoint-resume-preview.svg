<text x="975.0" y="465.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" fill="#475569"><tspan x="975.0" dy="0">schema · fingerprint ·</tspan><tspan x="975.0" dy="22.5">journal · prune floor</tspan></text>
