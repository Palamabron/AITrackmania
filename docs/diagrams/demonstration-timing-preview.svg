<rect x="100" y="965" width="790" height="75" rx="10" fill="#dcfce7" stroke="#2b8a3e" stroke-width="1.5"/>
<text x="114" y="996" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="18" fill="#1f2937"><tspan x="114" dy="0">Aggregation requires control_alignment=frame_start and integrates [t_k +</tspan><tspan x="114" dy="22.5">lead, t_{k+1} + lead). Gas/steering use duration-weighted means; brake taps</tspan><tspan x="114" dy="22.5">use overlap duration before quantization.</tspan></text>
<rect x="910" y="965" width="790" height="75" rx="10" fill="#fee2e2" stroke="#c92a2a" stroke-width="1.5"/>
<text x="924" y="996" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="18" fill="#1f2937"><tspan x="924" dy="0">--action-offset-ms shifts only open-loop replay timestamps for diagnosis. It</tspan><tspan x="924" dy="22.5">does not rewrite the demonstration or replace closed-loop bc-benchmark.</tspan></text>
