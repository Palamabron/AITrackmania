<rect x="120" y="860" width="1360" height="70" rx="10" fill="#ede9fe" stroke="#7048e8" stroke-width="1.5"/>
<text x="134" y="891" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="18" fill="#1f2937"><tspan x="134" dy="0">Promotion requires a recorded baseline, one changed variable, deterministic unit coverage and a bounded smoke comparison without</tspan><tspan x="134" dy="22.5">resume or distributed regressions.</tspan></text>
<rect x="120" y="945" width="1360" height="60" rx="10" fill="#dbeafe" stroke="#1864ab" stroke-width="1.5"/>
<text x="134" y="976" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="18" fill="#1f2937"><tspan x="134" dy="0">Keep Trackmania telemetry, geometry and action semantics in trackmaniarl.trackmania; keep generic neural and optimization components</tspan><tspan x="134" dy="22.5">game-independent.</tspan></text>
