<text x="900.0" y="278.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" fill="#475569"><tspan x="900.0" dy="0">authenticated</tspan><tspan x="900.0" dy="22.5">encryption</tspan></text>
<rect x="1000" y="220" width="130" height="95" rx="12" fill="#fee2e2" stroke="#c92a2a" stroke-width="2.5" filter="url(#shadow)"/>
