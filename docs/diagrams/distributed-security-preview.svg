<text x="170.0" y="250.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" fill="#111827"><tspan x="170.0" dy="0">CLI launcher</tspan></text>
<text x="170.0" y="278.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" fill="#475569"><tspan x="170.0" dy="0">multiprocessing</tspan><tspan x="170.0" dy="22.5">spawn</tspan></text>
