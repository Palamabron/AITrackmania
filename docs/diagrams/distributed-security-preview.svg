<rect x="590" y="150" width="570" height="315" rx="14" fill="#dbeafe" fill-opacity=".35" stroke="#1864ab" stroke-width="1.5" stroke-dasharray="8 7"/>
<text x="608" y="179" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="19" fill="#1864ab"><tspan x="608" dy="0">Remote actor · separate Trackmania host</tspan></text>
<rect x="40" y="495" width="1120" height="300" rx="14" fill="#ede9fe" fill-opacity=".35" stroke="#7048e8" stroke-width="1.5" stroke-dasharray="8 7"/>
