<text x="1065.0" y="300" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" fill="#475569"><tspan x="1065.0" dy="0">SSH/VPN</tspan><tspan x="1065.0" dy="22.5">forward</tspan></text>
<rect x="780" y="350" width="260" height="90" rx="12" fill="#fee2e2" stroke="#c92a2a" stroke-width="2.5" filter="url(#shadow)"/>
<text x="910.0" y="377.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" fill="#111827"><tspan x="910.0" dy="0">Same run identity</tspan></text>
<text x="910.0" y="405.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" fill="#475569"><tspan x="910.0" dy="0">token · fingerprint ·</tspan><tspan x="910.0" dy="22.5">map · contracts</tspan></text>
<rect x="75" y="570" width="240" height="105" rx="12" fill="#fee2e2" stroke="#c92a2a" stroke-width="2.5" filter="url(#shadow)"/>
<text x="195.0" y="597" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" fill="#111827"><tspan x="195.0" dy="0">Coordinator</tspan><tspan x="195.0" dy="25.0">endpoint</tspan></text>
<text x="195.0" y="650" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" fill="#475569"><tspan x="195.0" dy="0">bounded authenticated</tspan><tspan x="195.0" dy="22.5">requests</tspan></text>
<rect x="350" y="570" width="240" height="105" rx="12" fill="#ffedd5" stroke="#d97706" stroke-width="2.5" filter="url(#shadow)"/>
<text x="470.0" y="603.75" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" fill="#111827"><tspan x="470.0" dy="0">WAL + applied</tspan><tspan x="470.0" dy="25.0">frontier</tspan></text>
<text x="470.0" y="656.75" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" fill="#475569"><tspan x="470.0" dy="0">persist before ACK</tspan></text>
<rect x="625" y="570" width="240" height="105" rx="12" fill="#ede9fe" stroke="#7048e8" stroke-width="2.5" filter="url(#shadow)"/>
<text x="745.0" y="605.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" fill="#111827"><tspan x="745.0" dy="0">Replay + learner</tspan></text>
<text x="745.0" y="633.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" fill="#475569"><tspan x="745.0" dy="0">sample · update ·</tspan><tspan x="745.0" dy="22.5">evaluate</tspan></text>
<rect x="900" y="570" width="220" height="105" rx="12" fill="#dbeafe" stroke="#1864ab" stroke-width="2.5" filter="url(#shadow)"/>
<text x="1010.0" y="605.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" fill="#111827"><tspan x="1010.0" dy="0">Portable outputs</tspan></text>
<text x="1010.0" y="633.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" fill="#475569"><tspan x="1010.0" dy="0">policy snapshot ·</tspan><tspan x="1010.0" dy="22.5">checkpoint</tspan></text>
<rect x="80" y="825" width="1040" height="60" rx="10" fill="#dcfce7" stroke="#2b8a3e" stroke-width="1.5"/>
<text x="94" y="856" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="18" fill="#1f2937"><tspan x="94" dy="0">Local does not mean in-process: actor and learner are separate spawn-safe processes, and failures must</tspan><tspan x="94" dy="22.5">propagate to the launcher.</tspan></text>
<rect x="80" y="905" width="1040" height="60" rx="10" fill="#fee2e2" stroke="#c92a2a" stroke-width="1.5"/>
<text x="94" y="936" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="18" fill="#1f2937"><tspan x="94" dy="0">Never expose gRPC directly. Keep the learner on literal loopback and carry it through an authenticated</tspan><tspan x="94" dy="22.5">encrypted tunnel.</tspan></text>
</svg>
