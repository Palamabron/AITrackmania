<text x="124" y="956" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="18" fill="#1f2937"><tspan x="124" dy="0">Trusted-code boundary: run.yaml and imported module:attribute components execute Python. Authentication does not make untrusted</tspan><tspan x="124" dy="22.5">extensions or checkpoints safe.</tspan></text>
<rect x="110" y="1005" width="1380" height="70" rx="10" fill="#ffedd5" stroke="#d97706" stroke-width="1.5"/>
<text x="124" y="1036" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="18" fill="#1f2937"><tspan x="124" dy="0">Recovery invariant: session ID + chunk sequence + learner ingest watermark prevent duplicate replay insertion when either side restarts</tspan><tspan x="124" dy="22.5">after an uncertain acknowledgement.</tspan></text>
