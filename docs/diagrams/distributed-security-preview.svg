<text x="430.0" y="278.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" fill="#475569"><tspan x="430.0" dy="0">game · policy ·</tspan><tspan x="430.0" dy="22.5">spool</tspan></text>
