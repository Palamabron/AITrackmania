# optimal-params-tuning-v5.11-stable
# Merge these keys into ~/TmrlData/config/local.yaml (deep merge on top of Hydra defaults),
# or apply the same patches via TMRL_CONFIG_OVERRIDES (JSON object).
#
# v5.11 vs v5.10: aligns training throttle + target Polyak with the legacy WandB run that
# worked well (env warmup 20k, updates/env-step cap 15, tau≈1-polyak, sync 250/1000,
# Sophy-style actor/critic depth 2/4, finish reward 10).
#
# Demos: see project docs / chat — you do not need new recordings if you still use the same
# map, interface, and obs; re-record if reward or observation geometry changed a lot.

run:
  name: optimal-params-tuning-v5.11-stable
  reset_training: false
  buffers_maxlen: 1000000
  rw_max_samples_per_episode: 28000
  rw_test_episode_interval: 20

distributed:
  public_ip_server: "127.0.0.1"

training:
  rounds_per_epoch: 20
  training_steps_per_round: 300
  environment_steps_before_training: 20000
  max_training_steps_per_environment_step: 15
  update_model_interval: 250
  update_buffer_interval: 1000
  batch_size: 512

model:
  residual_mlp_hidden_dim: 192
  # IQN: only residual_mlp_num_blocks applies (shared Q trunk); actor/critic splits are SAC/TQC.
  residual_mlp_num_blocks: 3
  residual_mlp_num_blocks_actor: 3
  residual_mlp_num_blocks_critic: 3
  split_track_observation: true
  use_simbav2: true
  track_encoder: gnn
  gnn_layers: 2
  gnn_hidden: 128
  binary_brake: true

algorithm:
  name: IQN
  _target_: tmrl.custom.custom_algorithms.iqn.IQNAgent
  iqn_lr: 5.0e-5
  iqn_huber_kappa: 0.7
  iqn_sort_quantiles: true
  iqn_monotonicity_regularization: false
  iqn_monotonicity_lambda: 0.01

  iqn_munchausen_enabled: false
  iqn_munchausen_alpha: 0.02
  iqn_munchausen_tau: 0.2
  iqn_munchausen_clip_min: -0.3
  iqn_munchausen_clip_max: 0.0

  iqn_epsilon_schedule_mode: linear
  iqn_epsilon_start: 0.65
  iqn_epsilon_end: 0.015
  iqn_epsilon_decay_steps: 400000
  iqn_epsilon_cosine_t0: 50000
  iqn_epsilon_cosine_tmult: 1.5
  iqn_epsilon_cosine_decay: 0.8
  iqn_epsilon_cosine_floor_fraction: 0.5

  iqn_explore_repeat_steps: 1
  iqn_soft_target_tau: 0.005
  backup_clip_range: 25.0
  reward_normalize_scale: 1.0

  n_steps: 3
  iqn_dueling: true
  iqn_double_dqn: true
  iqn_grad_clip: 2.5

player_runs:
  online_injection: true
  max_files_per_update: 6
  demo_sampling_weight: 1.2
  demo_weight_decay_samples: 1500000
  demo_weight_decay_slowdown: 1.5
  demo_max_batch_fraction: 0.25
  demo_min_batch_fraction: 0.10

environment:
  seed: 1111
  init_gas_bias: 0.9
  map_name: test-3
  end_of_track_reward: 10.0
  window_width: 1920
  window_height: 1080
  use_images: false
  track_coords_divisor: 50.0
  reward:
    min_seconds_before_failure: 15.0
    debug_reward_components: true
    constant_penalty: 0.0015
    speed_reward_weight: 1.5
    speed_reward_exponent: 1.4
    speed_reward_alignment_floor: 0.4
    max_speed_kmh: 300.0

    max_track_width: 24.0
    reward_clip_floor: 5.0
    track_look_ahead_pct: 5.0
    track_point_spacing_m: 2.5
    track_local_frame: true
    track_curvature_obs: true

    drift_reward_weight: 0.1
    drift_reward_weight_start: 0.15
    drift_anneal_steps: 250000
    drift_optimal_angle_deg: 12.5
