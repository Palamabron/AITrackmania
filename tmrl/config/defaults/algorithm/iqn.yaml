# @package _global_
defaults:
  - default
  - _self_

algorithm:
  _target_: tmrl.custom.custom_algorithms.iqn.IQNAgent
  name: IQN
  mixed_precision: true
  mixed_precision_dtype: bfloat16
  n_steps: 3
  gamma: 0.99
  learn_entropy_coef: true
  lr_actor: 5.0e-5
  lr_critic: 5.0e-5
  lr_entropy: 3.0e-5
  iqn_lr: 1.0e-4
  iqn_epsilon_schedule_mode: linear
  iqn_epsilon_start: 1.0
  iqn_epsilon_end: 0.01
  iqn_explore_repeat_steps: 1
  iqn_epsilon_decay_steps: 500000
  iqn_target_update_freq: 1000
  iqn_num_quantiles_train: 64
  iqn_num_quantiles_target: 64
  iqn_num_quantiles_eval: 32
  iqn_n_steer_bins: 13
  iqn_n_actions: 78
  iqn_n_cos: 64
  iqn_dueling: true
  iqn_double_dqn: true
  iqn_grad_clip: 10.0
  quantiles_number: 25
  top_quantiles_to_drop: 3
