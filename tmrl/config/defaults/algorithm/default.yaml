# @package _global_
# Baseline continuous RL hyperparameters (SAC-oriented); IQN/SAC presets extend this file.
algorithm:
  name: SAC
  learn_entropy_coef: false
  lr_actor: 1.0e-5
  lr_critic: 5.0e-5
  lr_entropy: 3.0e-4
  gamma: 0.99
  polyak: 0.995
  target_entropy: -0.5
  alpha: 0.01
  redq_n: 10
  redq_m: 2
  redq_q_updates_per_policy_update: 20
  top_quantiles_to_drop: 2
  quantiles_number: 1
  n_steps: 1
  r2d2_rewind: 0.5
  r2d2_num_sequences: 0
  r2d2_sequence_length: 0
  r2d2_burn_in: 0
  optimizer_actor: adam
  optimizer_critic: adam
  betas_actor: [0.9, 0.999]
  betas_critic: [0.9, 0.999]
  l2_actor: 0.0
  l2_critic: 0.0
  grad_clip_actor: 1.0
  grad_clip_critic: 1.0
  backup_clip_range: 100.0
  reward_normalize_scale: 1.0
  mean_penalty_coef: 0.05
  dynamic_truncation_enabled: false
  dynamic_truncation_variance_pct: 0.9
  vcse_enabled: false
  vcse_lambda: 0.5
  vcse_alpha_base: 0.03
  clipping_weights: false
  clip_weights_value: 1.0
  actor_weight_decay: 0.0
  critic_weight_decay: 0.0
  num_track_points: 0
  points_distance: 0.0
  speed_bonus: 0.0
  speed_min_threshold: 0.0
  speed_medium_threshold: 0.0
  adam_eps: 1.0e-8
  bc_lambda: 0.0
  bc_lambda_start: 1.0
  bc_lambda_end: 0.01
  bc_anneal_steps_start: 0
  bc_anneal_steps_end: 2000000
  mixed_precision: true
  mixed_precision_dtype: bfloat16
  horizontal_flip_p: 0.5
  per_td_enabled: false
  per_td_alpha: 0.6
  per_td_beta: 0.4
  per_td_eps: 1.0e-6
  use_sde: true
  log_std_init: -3.0
  sde_clip_mean: 2.0
  sde_sample_freq: 100
  entropy_floor: 0.02
  entropy_schedule: learnable
  entropy_cosine_t0: 300
  entropy_cosine_tmult: 1.5
  entropy_cosine_decay: 0.7
  fog_decay_temperature: 3.0
  eder_oversample_ratio: 0
  sdsac_avg_q: true
  sdsac_clip_q: true
  sdsac_clip_q_epsilon: 0.5
  sdsac_entropy_penalty: true
  sdsac_entropy_penalty_beta: 0.5
  iqn_n_steer_bins: 13
  iqn_lr: 1.0e-4
  iqn_epsilon_schedule_mode: cosine
  iqn_epsilon_start: 1.0
  iqn_epsilon_end: 0.005
  iqn_explore_repeat_steps: 4
  iqn_epsilon_decay_steps: 500000
  iqn_epsilon_cosine_t0: 50000
  iqn_epsilon_cosine_tmult: 1.5
  iqn_epsilon_cosine_decay: 0.8
  iqn_target_update_freq: 1000
  iqn_num_quantiles_train: 64
  iqn_num_quantiles_target: 64
  iqn_num_quantiles_eval: 32
  iqn_n_cos: 64
  iqn_dueling: true
  iqn_double_dqn: true
  iqn_grad_clip: 10.0
  iqn_epsilon_cosine_initial_amplitude: 0.1
  iqn_epsilon_cosine_floor_fraction: 0.03
  iqn_epsilon_cosine_floor_steps: 0
  iqn_n_actions: 78
