# @package _global_
# real-time-gym loop for TrackMania 2020 environment presets.
# Use: defaults: [tm20_rtgym, _self_] in e.g. `tm20.yaml` (not a selectable `environment=` by itself).
environment:
  rtgym:
    time_step_duration: 0.05
    start_obs_capture: 0.04
    time_step_timeout_factor: 1.0
    act_buf_len: 2
    reset_act_buf: true
    benchmark: false
    wait_on_done: true
    ep_max_length: 5000
    interface_kwargs:
      save_replays: false
