# @package _global_
# TMRL Hydra entrypoint. Override groups, e.g.
# `algorithm=iqn model=mlp_actor_critic`.
# Model presets are full model-oriented files only (no aliases).
# Default: SAC + residual MLP on boundary lidar (discrete vectors). For IQN: algorithm=iqn. For the Sophy
# residual CNN/TQC preset: TMRL_HYDRA_OVERRIDES='["model=sophy_residual_actor_critic"]'
#
# Hierarchy: each `name: preset` line pulls in `defaults/<group>/<preset>.yaml` (see README).
# Values below are the root-only keys; most knobs live in those group files or local.yaml.
defaults:
  - _self_
  - distributed: default
  - training: default
  - memory: default
  - interface: default
  - model: residual_mlp_actor_critic
  - algorithm: sac
  - environment: tm20
  - debugger: default

schema_version: "0.8.0"

# --- run / logging / compute / demos (root; other sections come from defaults/ groups) ---

run:
  name: tmrl_run
  reset_training: false
  dataset_path: ""
  buffers_maxlen: 500000
  rw_max_samples_per_episode: 1000
  rw_test_episode_interval: 5
  rw_test_episodes_per_eval: 10

wandb:
  project: tmrl
  entity: tmrl
  api_key: ""
  log_gradients: false
  debug_reward: true
  log_from_worker: true

compute:
  cuda_training: true
  cuda_inference: false
  virtual_gamepad: true

player_runs:
  online_injection: false
  source_path: ""
  consume_on_read: true
  max_files_per_update: 1
  demo_injection_repeat: 1
  demo_sampling_weight: 1.0
  demo_weight_decay_samples: 0
  demo_weight_decay_slowdown: 1.0
  per_alpha: 0.6
  demo_max_batch_fraction: 1.0
  demo_min_batch_fraction: 0.0
