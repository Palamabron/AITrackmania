# @package _global_
# Trainer loop, replay, checkpoints, LR schedule.
training:
  max_epochs: 10000
  rounds_per_epoch: 100
  training_steps_per_round: 200
  max_training_steps_per_environment_step: 4.0
  environment_steps_before_training: 1000
  update_model_interval: 200
  update_buffer_interval: 200
  save_model_every: 0
  best_checkpoint_criterion: eval
  best_checkpoint_lap_time: true
  best_checkpoint_min_finishes: null
  competition_eval_crash_penalty_s: 10.0
  competition_eval_max_crashes: 3
  memory_size: 1000000
  batch_size: 256
  batches_per_step: 1
  scheduler:
    name: ""
    t_0: 100
    t_mult: 2
    eta_min: 1.0e-6
    last_epoch: -1
