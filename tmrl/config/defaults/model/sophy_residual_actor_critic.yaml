# @package _global_
# Full model preset matching `tmrl/custom/models/hybrid_input/sophy.py::SophyResidualActorCritic`.
model:
  type: sophy_residual_actor_critic
  noisy_linear_critic: false
  noisy_linear_actor: false
  output_dropout: 0.0
  rnn_dropout: 0.0
  cnn_filters: [32, 64, 64, 64]
  cnn_output_size: 256
  rnn_lens: [1]
  rnn_sizes: [64]
  api_mlp_sizes: [256, 256]
  api_layernorm: true
  mlp_layernorm: true
  use_residual_mlp: false
  residual_mlp_hidden_dim: 192
  residual_mlp_num_blocks: 4
  residual_mlp_num_blocks_actor: 2
  residual_mlp_num_blocks_critic: 4
  use_sophy_residual_actor: true
  split_track_observation: true
  use_simbav2: true
  track_encoder: gnn
  gnn_layers: 2
  gnn_hidden: 128
  binary_brake: true
  use_rnn: true
  rnn_hidden_size: 192
  use_efficientnet: true
  use_frozen_effnet: false
  frozen_effnet_embed_dim: 256
  frozen_effnet_width_mult: 0.5
  frozen_effnet_variant: xs
  frozen_effnet_use_dw_stem: false
