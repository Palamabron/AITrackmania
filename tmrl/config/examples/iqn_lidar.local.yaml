# Copy to ~/TmrlData/config/local.yaml (merged over tmrl/config/defaults via Hydra).
#
# IQN + LIDAR pipeline
# --------------------
# - Algorithm: IQN (quantile critic + discrete steering) with R2D2-style sequences (n_steps,
#   r2d2_*). Model preset: sophy_residual_actor_critic (RNN + track encoder); must match
#   environment.rtgym_interface ending in LIDAR when use_rnn is true.
# - OpenPlanet: exactly one TMRL_GrabData instance; stay in a map with the car on the track
#   (not main menu), port 9000 free.
# - Pickles: TmrlData/reward/reward_<map_name>.pkl and track/track_<map_name>_{left,right}.pkl;
#   set environment.map_name to the same id (e.g. test-3 → reward_test-3.pkl).
# - Secrets: WANDB_API_KEY / WANDB_KEY and TMRL_PASSWORD belong in TmrlData/.env or
#   TmrlData/config/.env (loaded by tmrl.config.loader); do not commit them here.
# - Typical launch (same repo + same local.yaml on every machine): start the TMRL server,
#   then trainer, then worker(s), e.g. make server → make trainer → make worker (trainer
#   uses wandb by default; pass --no-wandb to disable).
# - Optional Hydra composition tweaks (keep algorithm/model/env consistent), e.g.:
#     export TMRL_HYDRA_OVERRIDES='algorithm=iqn,model=sophy_residual_actor_critic,environment=tm20'
#
# Weights & Biases naming
# -----------------------
# - wandb.project / wandb.entity: project folder and team or user in the W&B UI (entity is
#   often your W&B username unless you use a team).
# - run.name: used as checkpoint / weight basename (TmrlData/weights/<name>.tmod) and as the
#   wandb run id base. The app appends " TRAINER" and " WORKER" to id= so trainer and worker
#   runs are clearly paired under the same experiment label. Use a short, filesystem-safe slug
#   (no path characters); spaces in run.name are allowed but show up in run ids.

run:
  # Base experiment id (checkpoints + wandb id prefix). Example: map + algo + version.
  name: iqn_lidar_test-3_v1
  reset_training: false
  buffers_maxlen: 1000000
  rw_max_samples_per_episode: 28000
  rw_test_episode_interval: 20
  rw_test_episodes_per_eval: 10

wandb:
  project: tmrl
  entity: tmrl # set to your W&B username or team (e.g. kubston20004)
  # api_key: use WANDB_API_KEY in .env instead
  log_from_worker: true
  debug_reward: true
  log_gradients: false

compute:
  cuda_training: true
  cuda_inference: false
  virtual_gamepad: true

distributed:
  localhost_worker: true
  localhost_trainer: true
  public_ip_server: "127.0.0.1"
  use_tls: false
  tls_hostname: default
  tls_credentials_directory: ""

environment:
  map_name: test-3 # must match reward_<map_name>.pkl / track_<map_name>_*.pkl

training:
  rounds_per_epoch: 10
  training_steps_per_round: 300
  max_training_steps_per_environment_step: 15.0
  environment_steps_before_training: 1000
  update_model_interval: 250
  update_buffer_interval: 1000
  memory_size: 1000000
  batch_size: 512
  batches_per_step: 1

# Overrides on top of preset sophy_residual_actor_critic (keep type in sync).
model:
  type: sophy_residual_actor_critic
  residual_mlp_num_blocks: 3
  use_efficientnet: false
  frozen_effnet_embed_dim: 128
  frozen_effnet_width_mult: 0.45

algorithm:
  name: IQN
  iqn_lr: 1.0e-4
  n_steps: 3
  r2d2_num_sequences: 16
  r2d2_sequence_length: 32
  r2d2_burn_in: 16

player_runs:
  online_injection: true
  source_path: ""
  consume_on_read: true
  max_files_per_update: 6
  demo_injection_repeat: 1
  demo_sampling_weight: 1.2
  demo_weight_decay_samples: 1500000
  demo_weight_decay_slowdown: 1.5
  per_alpha: 0.6
  demo_max_batch_fraction: 0.25
  demo_min_batch_fraction: 0.10

# Extend environment.reward in your own file (large reward blocks are map-specific).
