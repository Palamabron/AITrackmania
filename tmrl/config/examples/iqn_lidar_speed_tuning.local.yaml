# Copy to ~/TmrlData/config/local.yaml to run the first IQN speed-tuning A/B.
# This is based on miqn_crossing-stable-progress-v3.1, but avoids changing the
# global defaults used by other experiments.

run:
  name: miqn_crossing-speed-tuning-v3.2
  reset_training: true
  buffers_maxlen: 1000000
  rw_max_samples_per_episode: 28000
  rw_test_episode_interval: 20

distributed:
  public_ip_server: "127.0.0.1"

training:
  rounds_per_epoch: 10
  training_steps_per_round: 300
  environment_steps_before_training: 1000
  max_training_steps_per_environment_step: 8.0
  update_model_interval: 150
  update_buffer_interval: 500
  batch_size: 512

model:
  residual_mlp_hidden_dim: 192
  residual_mlp_num_blocks: 3
  residual_mlp_num_blocks_actor: 3
  residual_mlp_num_blocks_critic: 3
  split_track_observation: true
  use_simbav2: true
  track_encoder: gnn
  gnn_layers: 2
  gnn_hidden: 128
  binary_brake: true

algorithm:
  name: IQN
  _target_: tmrl.custom.custom_algorithms.iqn.IQNAgent
  iqn_lr: 5.0e-5
  iqn_huber_kappa: 0.7
  iqn_sort_quantiles: false
  iqn_monotonicity_regularization: false
  iqn_monotonicity_lambda: 0.0
  iqn_munchausen_enabled: false
  iqn_munchausen_alpha: 0.04
  iqn_munchausen_tau: 0.2
  iqn_munchausen_clip_min: -0.3
  iqn_munchausen_clip_max: 0.0
  iqn_epsilon_schedule_mode: linear
  iqn_epsilon_start: 0.6
  iqn_epsilon_end: 0.02
  iqn_epsilon_decay_steps: 700000
  iqn_explore_repeat_steps: 1
  iqn_soft_target_tau: 0.0015
  backup_clip_range: 20.0

player_runs:
  online_injection: true
  max_files_per_update: 6
  demo_sampling_weight: 1.2
  demo_weight_decay_samples: 1500000
  demo_weight_decay_slowdown: 1.5
  demo_max_batch_fraction: 0.25
  demo_min_batch_fraction: 0.10

environment:
  seed: 1111
  init_gas_bias: 0.8
  map_name: test-3
  end_of_track_reward: 10.0
  window_width: 1920
  window_height: 1080
  use_images: false
  reward:
    # Legacy/no-op fields are intentionally omitted: min_progress_rate,
    # slow_progress_window_seconds, cte_penalty_weight, progress_min_alignment,
    # and velocity_alignment_reward_weight do not affect current reward logic.
    min_seconds_before_failure: 12.0
    debug_reward_components: true
    constant_penalty: 0.0001
    speed_reward_weight: 0.35
    speed_reward_alignment_floor: 0.25
    max_track_width: 24.0
    reward_clip_floor: 5.0
    track_look_ahead_pct: 5.0
    track_point_spacing_m: 2.5
    track_local_frame: true
    track_curvature_obs: true
    drift_reward_weight: 0.1
    drift_reward_weight_start: 0.15
    drift_anneal_steps: 250000
    drift_optimal_angle_deg: 12.5
