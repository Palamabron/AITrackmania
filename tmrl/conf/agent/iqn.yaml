# @package _global_
# Implicit Quantile Networks (discrete steering) hyperparameters
ALG:
  ALGORITHM: IQN
  MIXED_PRECISION: true
  MIXED_PRECISION_DTYPE: bfloat16
  N_STEPS: 3
  GAMMA: 0.99
  LEARN_ENTROPY_COEF: true
  LR_ACTOR: 5.0e-5
  LR_CRITIC: 5.0e-5
  LR_ENTROPY: 3.0e-5
  IQN_LR: 1.0e-4
  IQN_EPSILON_SCHEDULE_MODE: linear
  IQN_EPSILON_START: 1.0
  IQN_EPSILON_END: 0.01
  IQN_EXPLORE_REPEAT_STEPS: 1
  IQN_EPSILON_DECAY_STEPS: 500000
  IQN_TARGET_UPDATE_FREQ: 1000
  IQN_NUM_QUANTILES_TRAIN: 64
  IQN_NUM_QUANTILES_TARGET: 64
  IQN_NUM_QUANTILES_EVAL: 32
  IQN_N_COS: 64
  IQN_DUELING: true
  IQN_DOUBLE_DQN: true
  IQN_GRAD_CLIP: 10.0
  QUANTILES_NUMBER: 25
  TOP_QUANTILES_TO_DROP: 3
