# @package _global_
# Hydra entry: composed defaults + run metadata. Override via CLI, e.g. agent=sac model=cnn
defaults:
  - _self_
  - network: default
  - agent: iqn
  - model: simba
  - env: tm20
  - debugger: default

RUN_NAME: tmrl_run
RESET_TRAINING: false
DATASET_PATH: ""
BUFFERS_MAXLEN: 500000
RW_MAX_SAMPLES_PER_EPISODE: 1000
RW_TEST_EPISODE_INTERVAL: 5
RW_TEST_EPISODES_PER_EVAL: 10
CUDA_TRAINING: true
CUDA_INFERENCE: false
VIRTUAL_GAMEPAD: true
LOCALHOST_WORKER: true
LOCALHOST_TRAINER: true
PUBLIC_IP_SERVER: "0.0.0.0"
PASSWORD: YourRandomPasswordHere
TLS: false
TLS_HOSTNAME: default
TLS_CREDENTIALS_DIRECTORY: ""
NB_WORKERS: -1
WANDB_PROJECT: tmrl
WANDB_ENTITY: tmrl
WANDB_KEY: YourWandbApiKey
WANDB_GRADIENTS: false
WANDB_DEBUG_REWARD: true
WANDB_WORKER: true

PLAYER_RUNS:
  ONLINE_INJECTION: false
  SOURCE_PATH: ""
  CONSUME_ON_READ: true
  MAX_FILES_PER_UPDATE: 1
  DEMO_INJECTION_REPEAT: 1
  DEMO_SAMPLING_WEIGHT: 1.0
  DEMO_WEIGHT_DECAY_SAMPLES: 0
  DEMO_WEIGHT_DECAY_SLOWDOWN: 1.0
  PER_ALPHA: 0.6
  DEMO_MAX_BATCH_FRACTION: 1.0
  DEMO_MIN_BATCH_FRACTION: 0.0

# Root-level reward parameters merged into ENV.REWARD_CONFIG at load time
REWARD_CONFIG: {}

MODEL:
  MAX_EPOCHS: 10000
  ROUNDS_PER_EPOCH: 100
  TRAINING_STEPS_PER_ROUND: 200
  MAX_TRAINING_STEPS_PER_ENVIRONMENT_STEP: 4.0
  ENVIRONMENT_STEPS_BEFORE_TRAINING: 1000
  UPDATE_MODEL_INTERVAL: 200
  UPDATE_BUFFER_INTERVAL: 200
  SAVE_MODEL_EVERY: 0
  BEST_CHECKPOINT_CRITERION: eval
  BEST_CHECKPOINT_LAP_TIME: true
  BEST_CHECKPOINT_MIN_FINISHES: null
  COMPETITION_EVAL_CRASH_PENALTY_S: 10.0
  COMPETITION_EVAL_MAX_CRASHES: 3
  MEMORY_SIZE: 1000000
  BATCH_SIZE: 256
  BATCHES_PER_STEP: 1
  SCHEDULER:
    NAME: ""
    T_0: 100
    T_mult: 2
    eta_min: 1.0e-6
    last_epoch: -1
  NOISY_LINEAR_CRITIC: false
  NOISY_LINEAR_ACTOR: false
  OUTPUT_DROPOUT: 0.0
  RNN_DROPOUT: 0.0
  CNN_FILTERS: [32, 64, 64, 64]
  CNN_OUTPUT_SIZE: 256
  RNN_LENS: [1]
  RNN_SIZES: [64]
  API_MLP_SIZES: [256, 256]
  API_LAYERNORM: true
  MLP_LAYERNORM: false
  USE_RESIDUAL_MLP: false
  RESIDUAL_MLP_HIDDEN_DIM: 256
  RESIDUAL_MLP_NUM_BLOCKS: 6
  RESIDUAL_MLP_NUM_BLOCKS_ACTOR: 0
  RESIDUAL_MLP_NUM_BLOCKS_CRITIC: 0
  USE_RESIDUAL_SOPHY: false
  USE_TRACK_CONV1D: true
  USE_SIMBAV2: false
  TRACK_ENCODER: conv1d
  GNN_LAYERS: 3
  GNN_HIDDEN: 64
  BINARY_BRAKE: false
  USE_RNN: false
  RNN_HIDDEN_SIZE: 0
  USE_EFFICIENTNET: true
  USE_FROZEN_EFFNET: false
  FROZEN_EFFNET_EMBED_DIM: 256
  FROZEN_EFFNET_WIDTH_MULT: 0.5
  FROZEN_EFFNET_VARIANT: xs
  FROZEN_EFFNET_USE_DW_STEM: false

# Default algorithm hyperparameters (SAC-oriented); override with agent=iqn | sac
ALG:
  ALGORITHM: SAC
  LEARN_ENTROPY_COEF: false
  LR_ACTOR: 1.0e-5
  LR_CRITIC: 5.0e-5
  LR_ENTROPY: 3.0e-4
  GAMMA: 0.99
  POLYAK: 0.995
  TARGET_ENTROPY: -0.5
  ALPHA: 0.01
  REDQ_N: 10
  REDQ_M: 2
  REDQ_Q_UPDATES_PER_POLICY_UPDATE: 20
  TOP_QUANTILES_TO_DROP: 2
  QUANTILES_NUMBER: 1
  N_STEPS: 1
  CLIPPING_WEIGHTS: false
  CLIP_WEIGHTS_VALUE: 1.0
  ACTOR_WEIGHT_DECAY: 0.0
  CRITIC_WEIGHT_DECAY: 0.0
  NUMBER_OF_POINTS: 0
  POINTS_DISTANCE: 0.0
  SPEED_BONUS: 0.0
  SPEED_MIN_THRESHOLD: 0.0
  SPEED_MEDIUM_THRESHOLD: 0.0
  ADAM_EPS: 1.0e-8
  R2D2_REWIND: 0.5
  R2D2_NUM_SEQUENCES: 0
  R2D2_SEQUENCE_LENGTH: 0
  R2D2_BURN_IN: 0
  OPTIMIZER_ACTOR: adam
  OPTIMIZER_CRITIC: adam
  BETAS_ACTOR: [0.9, 0.999]
  BETAS_CRITIC: [0.9, 0.999]
  L2_ACTOR: 0.0
  L2_CRITIC: 0.0
  GRAD_CLIP_ACTOR: 1.0
  GRAD_CLIP_CRITIC: 1.0
  BACKUP_CLIP_RANGE: 100.0
  REWARD_NORMALIZE_SCALE: 1.0
  MEAN_PENALTY_COEF: 0.05
  DYNAMIC_TRUNCATION_ENABLED: false
  DYNAMIC_TRUNCATION_VARIANCE_PCT: 0.9
  VCSE_ENABLED: false
  VCSE_LAMBDA: 0.5
  VCSE_ALPHA_BASE: 0.03
  BC_LAMBDA: 0.0
  BC_LAMBDA_START: 1.0
  BC_LAMBDA_END: 0.01
  BC_ANNEAL_STEPS_START: 0
  BC_ANNEAL_STEPS_END: 2000000
  MIXED_PRECISION: true
  MIXED_PRECISION_DTYPE: bfloat16
  HORIZONTAL_FLIP_P: 0.5
  PER_TD_ENABLED: false
  PER_TD_ALPHA: 0.6
  PER_TD_BETA: 0.4
  PER_TD_EPS: 1.0e-6
  USE_SDE: true
  LOG_STD_INIT: -3.0
  SDE_CLIP_MEAN: 2.0
  SDE_SAMPLE_FREQ: 100
  ENTROPY_FLOOR: 0.02
  ENTROPY_SCHEDULE: learnable
  ENTROPY_COSINE_T0: 300
  ENTROPY_COSINE_TMULT: 1.5
  ENTROPY_COSINE_DECAY: 0.7
  FOG_DECAY_TEMPERATURE: 3.0
  EDER_OVERSAMPLE_RATIO: 0
  SDSAC_AVG_Q: true
  SDSAC_CLIP_Q: true
  SDSAC_CLIP_Q_EPSILON: 0.5
  SDSAC_ENTROPY_PENALTY: true
  SDSAC_ENTROPY_PENALTY_BETA: 0.5
  IQN_N_STEER_BINS: 13
  IQN_LR: 1.0e-4
  IQN_EPSILON_SCHEDULE_MODE: cosine
  IQN_EPSILON_START: 1.0
  IQN_EPSILON_END: 0.005
  IQN_EXPLORE_REPEAT_STEPS: 4
  IQN_EPSILON_DECAY_STEPS: 500000
  IQN_EPSILON_COSINE_T0: 50000
  IQN_EPSILON_COSINE_TMULT: 1.5
  IQN_EPSILON_COSINE_DECAY: 0.8
  IQN_TARGET_UPDATE_FREQ: 1000
  IQN_NUM_QUANTILES_TRAIN: 64
  IQN_NUM_QUANTILES_TARGET: 64
  IQN_NUM_QUANTILES_EVAL: 32
  IQN_N_COS: 64
  IQN_DUELING: true
  IQN_DOUBLE_DQN: true
  IQN_GRAD_CLIP: 10.0
  IQN_EPSILON_COSINE_INITIAL_AMPLITUDE: 0.1
  IQN_EPSILON_COSINE_FLOOR_FRACTION: 0.03
  IQN_EPSILON_COSINE_FLOOR_STEPS: 0
  IQN_N_ACTIONS: 78

__VERSION__: "0.6.0"
