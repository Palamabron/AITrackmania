# @package _global_
# SimbaV2 / Sophy-style residual trunk + track encoder (GNN) settings
MODEL:
  USE_RESIDUAL_SOPHY: true
  USE_SIMBAV2: true
  USE_TRACK_CONV1D: true
  USE_RNN: true
  RNN_HIDDEN_SIZE: 192
  RESIDUAL_MLP_HIDDEN_DIM: 192
  RESIDUAL_MLP_NUM_BLOCKS: 4
  RESIDUAL_MLP_NUM_BLOCKS_ACTOR: 2
  RESIDUAL_MLP_NUM_BLOCKS_CRITIC: 4
  TRACK_ENCODER: gnn
  GNN_LAYERS: 2
  GNN_HIDDEN: 128
  BINARY_BRAKE: true
  API_LAYERNORM: true
  MLP_LAYERNORM: true
