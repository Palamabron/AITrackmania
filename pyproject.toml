[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "TrackmaniaRL"
version = "2.0.0rc1"
description = "Reinforcement-learning library for training agents in Trackmania 2020"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Jakub Szulc" }]
keywords = [
    "reinforcement learning",
    "robot learning",
    "trackmania",
    "self driving",
    "roborace",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.0",
    "numpy>=1.24",
    "torch>=2.4",
    "tensordict>=0.6",
    "gymnasium>=0.29",
    "PyYAML>=6.0",
    "zstandard>=0.23",
]

[project.optional-dependencies]
orchestrator = [
    "google-genai>=2.2.0",
    "optuna>=3.0",
]
trackmania = [
    "libevdev>=0.13; sys_platform == 'linux'",
    "vgamepad>=0.1.0; sys_platform == 'win32' or sys_platform == 'linux'",
]
wandb = [
    "wandb>=0.15.8",
]
distributed = [
    "grpcio>=1.66",
    "protobuf>=5.27",
    "safetensors>=0.4.5",
]
mamba = [
    "causal-conv1d>=1.4; sys_platform == 'linux'",
    "mamba-ssm>=2.2; sys_platform == 'linux'",
]
all = [
    "google-genai>=2.2.0",
    "optuna>=3.0",
    "libevdev>=0.13; sys_platform == 'linux'",
    "vgamepad>=0.1.0; sys_platform == 'win32' or sys_platform == 'linux'",
    "wandb>=0.15.8",
    "grpcio>=1.66",
    "protobuf>=5.27",
    "safetensors>=0.4.5",
    "causal-conv1d>=1.4; sys_platform == 'linux'",
    "mamba-ssm>=2.2; sys_platform == 'linux'",
]

[tool.uv]
default-groups = ["dev"]
no-build-isolation-package = ["causal-conv1d", "mamba-ssm"]
constraint-dependencies = [
    "torch==2.11.0+cu128; sys_platform == 'win32' or sys_platform == 'linux'",
    "torch==2.11.0; sys_platform != 'win32' and sys_platform != 'linux'",
]

[tool.uv.extra-build-dependencies]
causal-conv1d = ["torch", "setuptools", "wheel", "packaging", "ninja"]
mamba-ssm = ["torch", "setuptools", "wheel", "packaging", "ninja"]

[tool.uv.sources]
# TrackMania training hosts use the tested CUDA wheels. Other platforms use
# their native PyTorch package and can override it for another backend.
torch = [
    { index = "pytorch-cuda", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
vgamepad = { git = "https://github.com/Palamabron/vgamepad", rev = "5f3435df3f8a0e658feb58b207d9137cdb5183cd" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "mypy>=1.8",
    "poethepoet>=0.36",
    "ruff>=0.4",
    "pytest>=7.0",
    "types-PyYAML",
    "grpcio>=1.66",
    "protobuf>=5.27",
    "safetensors>=0.4.5",
    "libevdev>=0.13; sys_platform == 'linux'",
    "vgamepad>=0.1.0; sys_platform == 'win32' or sys_platform == 'linux'",
    "wandb>=0.15.8",
    "matplotlib>=3.10.8",
    "plotly>=7.0.0",
]

[project.scripts]
trackmaniarl = "trackmaniarl.__main__:entrypoint"

[project.urls]
Homepage = "https://github.com/Palamabron/TrackmaniaRL"
Repository = "https://github.com/Palamabron/TrackmaniaRL"
Documentation = "https://github.com/Palamabron/TrackmaniaRL/tree/main/readme"
Issues = "https://github.com/Palamabron/TrackmaniaRL/issues"
Changelog = "https://github.com/Palamabron/TrackmaniaRL/blob/main/CHANGELOG.md"
Security = "https://github.com/Palamabron/TrackmaniaRL/blob/main/SECURITY.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["trackmaniarl*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
trackmaniarl = ["py.typed", "project/openplanet/*.as", "project/openplanet/*.toml"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]
extend-exclude = [".pytest-*"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "W",    # pycodestyle warnings
    "UP",   # pyupgrade
    "B",    # flake8-bugbear (common bug patterns)
    "ANN",  # require annotations on every function signature
    "SIM",  # flake8-simplify (simplifiable constructs)
    "RUF",  # ruff-specific rules
    "C4",   # flake8-comprehensions (unnecessary list/dict/set calls)
    "PT",   # flake8-pytest-style (test files)
    "TID",  # enforce absolute imports
    "FBT001",  # reject boolean positional parameters
    "FBT002",  # reject boolean default parameters
    "PLR0913", # cap caller-visible arguments
]
ignore = [
    "ANN401",  # Any is required at dynamic plugin and PyTree boundaries
    "N999",  # allow PascalCase module names (e.g. trackmaniarl/custom/models/Sophy.py)
    "N812",  # allow F for torch.nn.functional (PyTorch convention)
]
# RUF022 (__all__ sort) defaults to "unsafe"; allow it under `ruff check --fix` / `uv run poe fmt`.
extend-safe-fixes = ["RUF022"]

[tool.ruff.lint.pylint]
max-args = 3

[tool.pytest.ini_options]
addopts = [
    "--basetemp=.pytest-cache/tmp",
    "--strict-config",
    "--strict-markers",
]
cache_dir = ".pytest-cache/cache"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.poe.tasks]
fmt = [
    { cmd = "ruff format ." },
    { cmd = "ruff check --fix ." },
]
lint = "ruff check ."
types = "mypy trackmaniarl"
test = "pytest"
check = ["lint", "types"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "google",
    "google.*",
    "grpc",
    "grpc.*",
    "optuna",
    "optuna.*",
    "tensordict",
    "tensordict.*",
    "causal_conv1d",
    "causal_conv1d.*",
    "mamba_ssm",
    "mamba_ssm.*",
    "vgamepad",
    "vgamepad.*",
    "wandb",
    "wandb.*",
    "zstandard",
    "zstandard.*",
]
ignore_missing_imports = true
