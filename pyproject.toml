[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tmrl"
version = "1.0.0"
description = "Modular reinforcement-learning SDK for TrackMania"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Yann Bouteiller" },
  { name = "Edouard Geze" },
  { name = "Jakub Szulc"},
]
keywords = [
    "reinforcement learning",
    "robot learning",
    "trackmania",
    "self driving",
    "roborace",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "numpy>=1.24",
    "torch>=2.4",
    "tensordict>=0.6",
    "gymnasium>=0.29",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
orchestrator = [
    "google-genai>=2.2.0",
    "optuna>=3.0",
]
algorithms = [
    "einops>=0.7",
    "gymnasium>=0.29",
    "loguru>=0.7",
    "pandas>=2.0",
    "torchrl>=0.11",
]
trackmania = [
    "gymnasium>=0.29",
    "libevdev>=0.13; sys_platform == 'linux'",
    "vgamepad>=0.1.0; sys_platform == 'win32' or sys_platform == 'linux'",
]
wandb = [
    "wandb>=0.15.8",
]
distributed = [
    "grpcio>=1.66",
    "protobuf>=5.27",
    "safetensors>=0.4.5",
    "zstandard>=0.23",
    "libevdev>=0.13; sys_platform == 'linux'",
    "vgamepad>=0.1.0; sys_platform == 'win32' or sys_platform == 'linux'",
    "wandb>=0.15.8",
]
explain = [
    "captum>=0.7",
]
vision = [
    "torchvision>=0.15",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
# TrackMania hosts on Windows and Linux use the tested CUDA wheels. Other
# platforms use the CPU index and can override it for ROCm or another backend.
torch = [
    { index = "pytorch-cuda", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
    { index = "pytorch-cpu", marker = "sys_platform != 'win32' and sys_platform != 'linux'" },
]
# PR #47: Linux uinput force-feedback / register_notification.
vgamepad = { git = "https://github.com/yannbouteiller/vgamepad.git", rev = "90f95e3b0781ea7b9b8e24867c5dfbfda0deecea" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "einops>=0.7",
    "gymnasium>=0.29",
    "loguru>=0.7",
    "mypy>=1.8",
    "pandas>=2.0",
    "poethepoet>=0.36",
    "pyinstrument",
    "ruff>=0.4",
    "pytest>=7.0",
    "torchrl>=0.11",
    "types-PyYAML",
    "grpcio>=1.66",
    "protobuf>=5.27",
    "safetensors>=0.4.5",
    "zstandard>=0.23",
    "libevdev>=0.13; sys_platform == 'linux'",
    "vgamepad>=0.1.0; sys_platform == 'win32' or sys_platform == 'linux'",
    "wandb>=0.15.8",
]

[project.scripts]
tmrl = "tmrl.__main__:entrypoint"

[project.urls]
Upstream = "https://github.com/trackmania-rl/tmrl"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "tmrl",
    "tmrl.algorithms*",
    "tmrl.builtins*",
    "tmrl.core*",
    "tmrl.distributed*",
    "tmrl.experiments*",
    "tmrl.models*",
    "tmrl.observability*",
    "tmrl.project*",
    "tmrl.trackmania*",
]
exclude = ["tests*"]

[tool.setuptools.package-data]
tmrl = ["py.typed", "project/openplanet/*.as", "project/openplanet/*.toml"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]
extend-exclude = [".pytest-*"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "W",    # pycodestyle warnings
    "UP",   # pyupgrade
    "B",    # flake8-bugbear (common bug patterns)
    "SIM",  # flake8-simplify (simplifiable constructs)
    "RUF",  # ruff-specific rules
    "C4",   # flake8-comprehensions (unnecessary list/dict/set calls)
    "PT",   # flake8-pytest-style (test files)
]
ignore = [
    "N999",  # allow PascalCase module names (e.g. tmrl/custom/models/Sophy.py)
    "N812",  # allow F for torch.nn.functional (PyTorch convention)
]
# RUF022 (__all__ sort) defaults to "unsafe"; allow it under `ruff check --fix` / `uv run poe fmt`.
extend-safe-fixes = ["RUF022"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.poe.tasks]
fmt = [
    { cmd = "ruff format ." },
    { cmd = "ruff check --fix ." },
]
lint = "ruff check ."
types = "mypy tmrl"
test = "pytest"
check = ["lint", "types"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "captum",
    "captum.*",
    "google",
    "google.*",
    "grpc",
    "grpc.*",
    "optuna",
    "optuna.*",
    "tensordict",
    "tensordict.*",
    "vgamepad",
    "vgamepad.*",
    "wandb",
    "wandb.*",
    "zstandard",
    "zstandard.*",
]
ignore_missing_imports = true
