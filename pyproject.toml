[build-system]
requires = ["setuptools>=65.5"]
build-backend = "setuptools.build_meta"

[project]
name = "tmrl"
version = "1.0.0"
description = "Modular reinforcement-learning SDK for TrackMania"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Yann Bouteiller" },
  { name = "Edouard Geze" },
  { name = "Jakub Szulc", email = "szulcak05@gmail.com" },
]
keywords = [
    "reinforcement learning",
    "robot learning",
    "trackmania",
    "self driving",
    "roborace",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "numpy>=1.24",
    "torch>=2.4",
    "tensordict>=0.6",
    "PyYAML",
]

[project.optional-dependencies]
dev = [
    "einops>=0.7",
    "gymnasium>=0.29",
    "loguru>=0.7",
    "mypy>=1.8",
    "pandas>=2.0",
    "poethepoet>=0.36",
    "pyinstrument",
    "ruff>=0.4",
    "pytest>=7.0",
    "torchrl>=0.11",
    "types-PyYAML",
]
orchestrator = [
    "google-genai>=2.2.0",
    "optuna>=3.0",
]
algorithms = [
    "einops>=0.7",
    "gymnasium>=0.29",
    "loguru>=0.7",
    "pandas>=2.0",
    "torchrl>=0.11",
]
trackmania = [
    "gymnasium>=0.29",
    "vgamepad>=0.1.0; sys_platform == 'win32' or sys_platform == 'linux'",
]
wandb = [
    "wandb>=0.15.8",
]
explain = [
    "captum>=0.7",
]
vision = [
    "torchvision>=0.15",
]

[dependency-groups]
dev = [
    "einops>=0.7",
    "gymnasium>=0.29",
    "loguru>=0.7",
    "mypy>=1.8",
    "pandas>=2.0",
    "poethepoet>=0.36",
    "pyinstrument",
    "ruff>=0.4",
    "pytest>=7.0",
    "torchrl>=0.11",
    "types-PyYAML",
]

[project.scripts]
tmrl = "tmrl.__main__:entrypoint"

[project.urls]
Homepage = "https://github.com/trackmania-rl/tmrl"
Documentation = "https://github.com/trackmania-rl/tmrl#readme"
Repository = "https://github.com/trackmania-rl/tmrl"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "tmrl",
    "tmrl.algorithms*",
    "tmrl.builtins*",
    "tmrl.core*",
    "tmrl.experiments*",
    "tmrl.models*",
    "tmrl.observability*",
    "tmrl.project*",
    "tmrl.trackmania*",
]
exclude = ["tests*"]

[tool.setuptools.package-data]
tmrl = ["py.typed", "project/openplanet/*.as"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["tmrl"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "W",    # pycodestyle warnings
    "UP",   # pyupgrade
    "B",    # flake8-bugbear (common bug patterns)
    "SIM",  # flake8-simplify (simplifiable constructs)
    "RUF",  # ruff-specific rules
    "C4",   # flake8-comprehensions (unnecessary list/dict/set calls)
    "PT",   # flake8-pytest-style (test files)
]
ignore = [
    "N999",  # allow PascalCase module names (e.g. tmrl/custom/models/Sophy.py)
    "N812",  # allow F for torch.nn.functional (PyTorch convention)
]
# RUF022 (__all__ sort) defaults to "unsafe"; allow it under `ruff check --fix` / `uv run poe fmt`.
extend-safe-fixes = ["RUF022"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.poe.tasks]
fmt = [
    { cmd = "ruff format ." },
    { cmd = "ruff check --fix ." },
]
lint = "ruff check ."
types = "mypy tmrl"
test = "pytest"
check = ["lint", "types"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
